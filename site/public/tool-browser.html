ce=socket,bind,listen,accept /tmp/minihttp 8080","why":"`strace` (*system call trace*); `-e trace=…` = a comma list of calls to show; the rest is the program and its args. **Stops the process on every call** — that cost is why eBPF exists","act":"Act I — One machine talking to itself","lesson":"Lesson 3 — Building minihttp, the listening server"},{"cmd":"strace -e trace=accept /code/minihttp 8080","why":"watch only `accept`: it hangs until a connection reaches ESTABLISHED, then prints `= 4`","act":"Act I — One machine talking to itself","lesson":"Lesson 5b — TCP states and the SYN scan"}]},{"id":"ip netns","label":"`ip netns`","names":["ip netns"],"expand":"—","one":"Named network namespaces, created as bind mounts under `/run/netns` — which is why it cannot see Docker's","iface":"nsapi","mark":"‖","grammar":"obj-verb","mode":["mutate"],"taught":"namespaces","section":"Namespaces, cgroups, capabilities","caps":[["Named namespaces, as bind mounts",[["ip netns list","namespaces under /run/netns — NOT Docker's, which are unnamed"],["ip netns add blue","unshare plus a bind mount; this is why the name persists"],["ip netns exec blue ip addr","run a command inside it"],["ip netns exec blue bash","get a shell inside it"],["ls -l /proc/<pid>/ns/net","the namespace's real identity, as an inode — the test that actually works"]]]],"course":[{"cmd":"ip netns add test","why":"creates a named network namespace as a bind mount under `/run/netns/` — which is why `ip netns list` cannot see Docker's namespaces, which are not created this way","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1 — Namespaces"},{"cmd":"ip netns exec test ip addr","why":"`exec <name> <cmd>` runs a command inside that namespace. Expect a down `lo` and, depending on which tunnel modules your kernel has loaded, a handful of per-namespace stubs (`tunl0`, `gre0`, `sit0`, …). What matters is what is *absent*: no addresses, no routes, no way out","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1 — Namespaces"},{"cmd":"ip netns exec test ls -la /proc/self/ns/net","why":"**a different inode from the host's** — the whole proof, in one comparison","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1 — Namespaces"},{"cmd":"ip netns exec test ping 8.8.8.8","why":"fails, because a namespace with no route and no device cannot reach anything. The failure is the lesson","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1 — Namespaces"},{"cmd":"ip netns del test","why":"destroys it. opt: `ip netns list` to confirm","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1 — Namespaces"},{"cmd":"ip netns exec ns1 ip link set lo up","why":"even loopback starts down in a fresh namespace","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip netns del ns2","why":"deleting a namespace destroys every device still in it","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip netns exec vx1 ping -c3 10.200.0.2","why":"an overlay address reached across an underlay that has never heard of it","act":"Act IV — One machine pretends to be many","lesson":"Lesson 4 — Overlay and VXLAN"}]},{"id":"nsenter","label":"`nsenter`","names":["nsenter"],"expand":"\"namespace enter\" *(folklore — undocumented)*","one":"Entry into an *existing* process's namespaces — the mechanism under `docker exec` and `kubectl exec`, and the way into a container with no shell of its own","iface":"nsapi","mark":"","grammar":"same flag letters as `unshare`","mode":["mutate"],"taught":null,"section":"Namespaces, cgroups, capabilities","caps":[["Enter an existing process's namespaces",[["nsenter -t <pid> -n ip addr","run in that process's network namespace — the way into a Docker container"],["nsenter -t <pid> -a bash","all namespaces"],["nsenter -t 1 -n ss -tanp","the host's namespace from inside a privileged container"],["nsenter -t <pid> -n -- tcpdump -i eth0","capture inside a container that has no tcpdump"]]]],"course":[]},{"id":"runc","label":"`runc`","names":["runc"],"expand":"run container","one":"The OCI runtime that actually creates the namespaces and cgroups. Below every higher-level tool","iface":"nsapi","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"the kernel says no","section":"Namespaces, cgroups, capabilities","caps":[["The runtime that actually makes the namespaces",[["runc list","containers this runtime knows about"],["runc state <id>","its config and PID"],["runc spec","generate a default config.json — the OCI contract, readable"]]]],"course":[]},{"id":"unshare","label":"`unshare`","names":["unshare"],"expand":"—","one":"A new namespace of any type, created *around a new process* — the mechanism `docker run` performs for you","iface":"nsapi","mark":"","grammar":"flags (`-m -u -i -n -p -U -C -T`)","mode":["mutate"],"taught":"the kernel says no","section":"Namespaces, cgroups, capabilities","caps":[["A new namespace around a new process",[["unshare -n <cmd>","a fresh, empty network namespace"],["unshare -Urm --fork <cmd>","user + mount + PID, unprivileged — what a rootless container is"],["unshare --net --mount-proc -f bash","the flag letters ARE the /proc/<pid>/ns filenames"]]]],"course":[]},{"id":"cilium","label":"`cilium`","names":["cilium"],"expand":"—","one":"An eBPF datapath's own view: policy verdicts, identities, and its BPF maps","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate","live"],"taught":"encryption between Pods","section":"Container and cluster runtimes","caps":[["An eBPF datapath's own view",[["cilium status --verbose","datapath mode, masquerading, kube-proxy replacement state"],["cilium endpoint list","every endpoint and its security identity"],["cilium policy get","the policy as the agent compiled it, not as you wrote it"],["cilium monitor --type drop","stream drops with the reason and the identities involved"],["cilium bpf lb list","the load-balancer map — the actual service table"]]]],"course":[]},{"id":"cosign","label":"`cosign`","names":["cosign"],"expand":"—","one":"Whether an image is signed *by a key you trust* — and the trap that any attacker can sign with theirs","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"what you shipped","section":"Supply chain and runtime security","caps":[["Signed by a key you trust — and the trap",[["cosign generate-key-pair","a keypair"],["cosign sign --key cosign.key <img>","sign, which writes a signature to the registry"],["cosign verify --key cosign.pub <img>","verify against a key YOU chose"],["cosign verify <img>","the trap: verifying without pinning a key proves only that someone signed it"]]]],"course":[]},{"id":"crane","label":"`crane`","names":["crane"],"expand":"—","one":"A registry's raw content: digests, manifests, layers, without pulling the image","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"what you shipped","section":"Supply chain and runtime security","caps":[["A registry's raw content, without pulling",[["crane manifest <img>","the manifest as JSON"],["crane digest <img>","the immutable identity behind a mutable tag"],["crane config <img>","the image config: entrypoint, env, user"],["crane ls <repo>","every tag"],["crane copy <src> <dst>","move an image between registries with no local docker"]]]],"course":[]},{"id":"crictl","label":"`crictl`","names":["crictl"],"expand":"CRI control","one":"The node's container runtime *directly* — the only view left when the API server is down and `kubectl` is useless","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"static pods","section":"Container and cluster runtimes","caps":[["The node's runtime, with no API server involved",[["crictl ps -a","containers, when kubectl is useless"],["crictl pods","sandboxes"],["crictl logs <id>","logs straight from the runtime"],["crictl inspectp <id>","the pod sandbox config, including its network namespace"]]]],"course":[]},{"id":"docker","label":"`docker`","names":["docker"],"expand":"—","one":"The developer-facing view, and `docker network inspect` — Act IV's bridge and veth pairs, printed as JSON","iface":"httpapi","mark":"","grammar":"obj-verb","mode":["mutate","live"],"taught":"the fd table","section":"Container and cluster runtimes","caps":[["The developer-facing view of Act IV's mechanisms",[["docker network inspect bridge","the bridge, subnet and every attached container, as JSON"],["docker inspect -f '{{.State.Pid}}' <c>","the PID — the handle for nsenter"],["docker run --rm -it --privileged --network host <img>","no namespace of its own: the container is in the host's"],["docker exec -it <c> sh","nsenter with a friendlier face"],["docker events","stream container lifecycle events"]]]],"course":[{"cmd":"docker build -t netlab networking-fundamentals/code","why":"`build` = build an image; `-t netlab` = tag (name) it; trailing path = the **build context**, the directory holding the `Dockerfile`. From your own folder of the four files that path is `.` — the only command in the course naming a path on your Mac","act":"","lesson":"Starting the lab"},{"cmd":"docker run --rm -it --privileged --name lab netlab","why":"`--rm` = delete the container on exit; `-it` = interactive + TTY; `--privileged` = full kernel access, which is what lets you edit routes and namespaces; `--name lab` = a name to `exec` into later. **Acts I only**","act":"","lesson":"Starting the lab"},{"cmd":"docker run --rm -it --privileged --network host --name lab nicolaka/netshoot","why":"`--network host` = **no network namespace of its own** — the container is *in the host's*. Acts II–IV need this, and it is why their drills change the host's real networking. `netshoot` carries the tools; `netlab` adds a C compiler","act":"","lesson":"Starting the lab"},{"cmd":"docker exec -it lab zsh","why":"`exec` = run a command in an *already running* container; `zsh` = the shell to start","act":"","lesson":"Starting the lab"},{"cmd":"docker run --rm -it --privileged -p 8080:8080 --name lab netlab","why":"`-p 8080:8080` = publish container port to host port. The DNAT rule this writes is opened up in Act IV","act":"Act I — One machine talking to itself","lesson":"Lesson 5 — Ports and /proc/net/tcp"},{"cmd":"docker diff <container>","why":"(run on your Mac) the writable layer's changes versus the image: `A` added, `C` changed/copied-up, `D` deleted (a whiteout). Reads `upperdir` for you","act":"Act I — One machine talking to itself","lesson":"Lesson 6b — The container's filesystem (optional)"},{"cmd":"docker volume create <name>","why":"a persistent volume — a separate filesystem, not part of any overlay","act":"Act I — One machine talking to itself","lesson":"Lesson 6b — The container's filesystem (optional)"},{"cmd":"docker run -v <vol>:/data …","why":"mount it at `/data`; writes there bypass the overlay and survive the container","act":"Act I — One machine talking to itself","lesson":"Lesson 6b — The container's filesystem (optional)"},{"cmd":"docker run --rm nicolaka/netshoot cat /sys/fs/cgroup/memory.max","why":"`max` unlimited by default","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1b — cgroups"},{"cmd":"docker run --rm --memory 64m --memory-swap 64m nicolaka/netshoot cat /sys/fs/cgroup/memory.max","why":"`--memory` sets the limit; `--memory-swap` equal to it disables swap, so the limit is real. The file now reads `67108864`","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1b — cgroups"},{"cmd":"docker run -d -p 8080:80 --name pub nginx","why":"`-d` detached; `-p 8080:80` publishes host 8080 to container 80 — and *writes the DNAT rule you are about to read*","act":"Act IV — One machine pretends to be many","lesson":"Lesson 3 — iptables and NAT"}]},{"id":"etcdctl","label":"`etcdctl`","names":["etcdctl"],"expand":"etcd control","one":"The cluster's stored state as raw keys — the layer beneath every Kubernetes object","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate","live"],"taught":"etcd backup and restore","section":"Container and cluster runtimes","caps":[["The layer beneath every Kubernetes object",[["etcdctl get /registry/pods --prefix --keys-only","raw keys — the object graph as storage"],["etcdctl endpoint health --cluster","quorum health"],["etcdctl member list -w table","who is in the cluster"],["etcdctl snapshot save snap.db","a backup"],["etcdctl watch /registry/services --prefix","stream changes"]]]],"course":[]},{"id":"helm","label":"`helm`","names":["helm"],"expand":"—","one":"What a chart *renders to* before it is applied (`template`), and what is currently released (`history`)","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"shipping a set of objects","section":"Container and cluster runtimes","caps":[["What a chart renders to, before it is applied",[["helm template <rel> <chart> -f values.yaml","the manifests, locally, with no cluster involved"],["helm get manifest <rel>","what is actually installed"],["helm history <rel>","revisions, so you can roll back"],["helm diff upgrade <rel> <chart>","the change an upgrade would make"]]]],"course":[]},{"id":"kind","label":"`kind`","names":["kind"],"expand":"Kubernetes in Docker","one":"A real multi-node cluster on one machine, where every node is a container you can `docker exec` into","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"the lab with kind","section":"Container and cluster runtimes","caps":[["A real multi-node cluster where nodes are containers",[["kind create cluster --config cfg.yaml","multi-node, with port mappings"],["kind get nodes","the node containers"],["docker exec -it <node> bash","the payoff: a node you can actually get inside"],["kind load docker-image <img>","skip the registry entirely"]]]],"course":[]},{"id":"kubeadm","label":"`kubeadm`","names":["kubeadm"],"expand":"—","one":"What the control plane's own certificates and version skew actually are, and the upgrade plan","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"upgrades and version skew","section":"Container and cluster runtimes","caps":[["Certificates, version skew, upgrades",[["kubeadm certs check-expiration","every control-plane certificate and its expiry"],["kubeadm upgrade plan","which versions are legal from here"],["kubeadm token list","join tokens and their TTLs"],["kubeadm config print init-defaults","the full config, with defaults filled in"]]]],"course":[]},{"id":"kubectl","label":"`kubectl`","names":["kubectl"],"expand":"—","one":"The API server's whole object graph, and `explain` makes the schema self-describing","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["mutate","live"],"taught":"pod networking","section":"Container and cluster runtimes","caps":[["Find out what exists, without documentation",[["kubectl api-resources","every resource type, its short name and whether it is namespaced"],["kubectl explain pod.spec.containers --recursive","the schema, self-describing"],["kubectl get --raw /api/v1/namespaces","the REST API underneath, directly"]]],["Read state",[["kubectl get pods -o wide","adds node and Pod IP — the two columns you always want"],["kubectl get pod <p> -o yaml","the whole object, including what controllers wrote"],["kubectl get endpointslices -l kubernetes.io/service-name=<svc>","which Pods a Service actually points at"],["kubectl describe pod <p>","events at the bottom — where the real reason lives"]]],["Debug networking from inside the cluster",[["kubectl run tmp --rm -it --image=nicolaka/netshoot -- bash","a throwaway Pod with every tool"],["kubectl debug <pod> -it --image=nicolaka/netshoot --target=<c>","an ephemeral container sharing the target's namespaces"],["kubectl port-forward svc/<svc> 8080:80","a tunnel from your laptop into the cluster"],["kubectl exec <pod> -- cat /etc/resolv.conf","what the Pod's resolver is actually configured with"]]],["Watch and diff",[["kubectl get pods -w","stream changes"],["kubectl get events --sort-by=.lastTimestamp","chronological, which the default is not"],["kubectl diff -f manifest.yaml","what applying it would change"],["kubectl auth can-i --list --as system:serviceaccount:default:my-sa","what a service account may do"]]]],"course":[]},{"id":"trivy","label":"`trivy`","names":["trivy"],"expand":"—","one":"Known vulnerabilities and an SBOM for an image you are about to ship","iface":"httpapi","mark":"","grammar":"verb-obj","mode":["read-only"],"taught":"what you shipped","section":"Supply chain and runtime security","caps":[["What you are about to ship",[["trivy image <img>","known vulnerabilities by severity"],["trivy image --severity HIGH,CRITICAL --exit-code 1 <img>","the CI-gate form"],["trivy image --format cyclonedx -o sbom.json <img>","an SBOM"],["trivy fs .","scan a directory, including IaC misconfiguration"]]]],"course":[]},{"id":"etcdutl","label":"`etcdutl`","names":["etcdutl"],"expand":"etcd utility","one":"Offline snapshot operations (`snapshot restore`) that need no running etcd","iface":"local","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"etcd backup and restore","section":"Container and cluster runtimes","caps":[["Offline, so it needs no running etcd",[["etcdutl snapshot restore snap.db --data-dir /var/lib/etcd-new","restore into a fresh data directory"],["etcdutl snapshot status snap.db -w table","revision, keys and hash — verify a backup before you trust it"]]]],"course":[]},{"id":"jq","label":"`jq`","names":["jq"],"expand":"JSON query","one":"Turns `ip -j`, `kubectl -o json` and `docker inspect` into field lookups instead of `awk` guesses","iface":"local","mark":"","grammar":"*filter*","mode":["read-only"],"taught":"Act VIII in the wild","section":"General-purpose, used here to read kernel state","caps":[["Field lookups instead of awk guesses",[["ip -j addr | jq '.[].addr_info[].local'","every address, as data"],["kubectl get pods -o json | jq -r '.items[].status.podIP'","one field across a list"],["docker inspect <c> | jq '.[0].NetworkSettings'","drill in"],["jq -r '.[] | [.a,.b] | @tsv'","back to columns for a shell loop"]]]],"course":[]},{"id":"kube-bench","label":"`kube-bench`","names":["kube-bench"],"expand":"—","one":"The cluster's own config scored against the CIS benchmark, file by file","iface":"local","mark":"","grammar":"flags","mode":["read-only"],"taught":"the doors left open","section":"Supply chain and runtime security","caps":[["The CIS benchmark, file by file",[["kube-bench run --targets master","control-plane checks"],["kube-bench run --targets node","kubelet and node config"],["kube-bench --json","machine-readable, for a gate"]]]],"course":[]},{"id":"kustomize","label":"`kustomize`","names":["kustomize"],"expand":"—","one":"The same overlay-resolved output, with no templating language at all","iface":"local","mark":"","grammar":"verb-obj","mode":["read-only"],"taught":"shipping a set of objects","section":"Container and cluster runtimes","caps":[["Overlays with no templating language at all",[["kustomize build overlays/prod","the fully-resolved manifests"],["kubectl kustomize overlays/prod","the same, built into kubectl"],["kustomize edit set image app=repo:tag","mutate the kustomization file itself"]]]],"course":[]},{"id":"xxd","label":"`xxd` / `base64`","names":["xxd","base64"],"expand":"hex dump / —","one":"Reads the bytes when the text view is lying to you","iface":"local","mark":"","grammar":"flags","mode":["read-only"],"taught":"hashing","section":"General-purpose, used here to read kernel state","caps":[["When the text view is lying to you",[["xxd <file> | head","hex and ASCII side by side"],["xxd -p -l 16 /dev/urandom","plain hex, no offsets"],["base64 -d <<< '<b64>' | xxd","decode then inspect — reading a Kubernetes Secret"],["openssl x509 -in cert.pem -outform der | xxd | head","the bytes behind a certificate"]]]],"course":[]}],"iface":{"netlink":{"sig":"AF_NETLINK socket","blind":"What a packet <em>did</em>. It reports configured and tracked state, never a packet's path."},"procfs":{"sig":"open() on /proc or /sys","blind":"Anything the kernel does not already export as a file — and it is a snapshot, so transients are invisible."},"socket":{"sig":"socket(AF_INET, SOCK_STREAM|SOCK_DGRAM)","blind":"Why it failed. A socket tool reports the verdict; the cause needs another interface."},"packet":{"sig":"socket(AF_PACKET) or SOCK_RAW","blind":"Which process or rule was responsible. It sees bytes on a link, not the host state behind them."},"probe":{"sig":"ptrace / bpf(2) / perf_event_open","blind":"Nothing — and that is the point. The only interface that can say which kernel function dropped it. It does need a running target."},"nsapi":{"sig":"unshare / setns / clone + bind mount","blind":"What is <em>inside</em> a namespace. These move you between namespaces; they read nothing."},"httpapi":{"sig":"HTTPS/gRPC to a daemon or API server","blind":"What the kernel actually did. Every one of these reports intent, and intent diverges from mechanism."},"local":{"sig":"none — files or bytes you already have","blind":"Anything at all about your machine. These reshape input another tool produced."}},"ifaceOrder":["netlink","procfs","socket","packet","probe","nsapi","httpapi","local"],"marks":{"†":"netlink on the nf_tables backend, setsockopt on legacy. <code>iptables -V</code> tells you which.","‡":"packet for <code>-sS</code>, socket for the <code>-sT</code> default.","§":"SOCK_DGRAM ICMP, not SOCK_RAW — which is why ping no longer needs to be setuid.","¶":"NSS: files first. Measured against localhost it opened no socket at all.","‖":"nsapi to create and enter (bind mounts under /run/netns), netlink to list nsids. This is why it cannot see Docker's namespaces.","⁂":"socket for <code>s_client</code>, local for everything else (dgst, genpkey, enc, x509)."}};
const byId = Object.fromEntries(D.tools.map(t => [t.id, t]));
const IFACE_LABEL = {netlink:"netlink", procfs:"procfs", socket:"socket", packet:"packet",
  probe:"probe", nsapi:"nsapi", httpapi:"httpapi", local:"local"};
let sel = "ip", q = "", fIface = new Set(), fMode = new Set(), fRoster = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// The index's cells carry markdown backticks and bold; render just those two, escaping first.
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
                      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                      .replace(/\*([^*]+)\*/g, "<em>$1</em>");

function haystack(t){
  return [t.id, t.names.join(" "), t.expand, t.one, t.grammar, t.section,
          ...t.caps.flatMap(([g, cs]) => [g, ...cs.flatMap(c => c)]),
          ...t.course.flatMap(c => [c.cmd, c.why])].join(" ").toLowerCase();
}
D.tools.forEach(t => t._h = haystack(t));

function matches(t){
  if (fIface.size && !fIface.has(t.iface)) return false;
  if (fMode.size && !t.mode.some(m => fMode.has(m))) return false;
  if (fRoster && t.taught) return false;
  if (q && !t._h.includes(q)) return false;
  return true;
}

function drawFilters(){
  const f = document.getElementById("filters");
  const counts = {};
  D.tools.forEach(t => counts[t.iface] = (counts[t.iface] || 0) + 1);
  let h = D.ifaceOrder.map(i =>
    `<button class="chip" data-k="iface" data-v="${i}" aria-pressed="${fIface.has(i)}"
      title="${esc(D.iface[i].sig)}">${i} ${counts[i]}</button>`).join("");
  h += ["read-only", "mutate", "live"].map(m =>
    `<button class="chip m-${m.split("-")[0]}" data-k="mode" data-v="${m}"
      aria-pressed="${fMode.has(m)}">${m}</button>`).join("");
  h += `<button class="chip" data-k="roster" data-v="1" aria-pressed="${fRoster}">roster only</button>`;
  f.innerHTML = h;
}

function drawList(){
  const list = document.getElementById("list");
  const shown = D.tools.filter(matches);
  if (!shown.length){ list.innerHTML = `<p class="empty">Nothing matches. Clear a filter.</p>`; return; }
  let h = "", last = null;
  for (const t of shown){
    if (t.iface !== last){
      last = t.iface;
      const n = shown.filter(x => x.iface === last).length;
      h += `<div class="grp">${last}<span>${n}</span></div>`;
    }
    const dots = t.mode.map(m => `<i class="dot ${m.split("-")[0]}" title="${m}"></i>`).join("");
    h += `<button class="item" data-id="${esc(t.id)}" role="option"
      aria-current="${t.id === sel}"><span class="nm">${esc(t.id)}</span>
      ${t.taught ? "" : '<span class="rk">roster</span>'}
      <span class="dots">${dots}</span></button>`;
  }
  list.innerHTML = h;
}

function drawPane(){
  const t = byId[sel];
  const pane = document.getElementById("pane");
  if (!t){ pane.innerHTML = ""; return; }
  const info = D.iface[t.iface];
  const sibs = D.tools.filter(x => x.iface === t.iface && x.id !== t.id);

  let h = `<div class="wrap"><div class="hd"><h1>${esc(t.id)}</h1>`;
  if (t.expand && t.expand !== "—") h += `<p class="expand">${md(t.expand)}</p>`;
  h += `<div class="facets">
    <span class="tag if" title="${esc(info.sig)}">${IFACE_LABEL[t.iface]}</span>`;
  if (t.grammar) h += `<span class="tag">${md(t.grammar)}</span>`;
  h += t.mode.map(m => `<span class="tag ${m.split("-")[0]}">${m}</span>`).join("");
  h += t.taught
    ? `<span class="tag">taught — ${md(t.taught)}</span>`
    : `<span class="tag roster">roster only — no lesson runs it</span>`;
  h += `</div></div>`;

  h += `<section><h2>The one thing only it shows you</h2>
        <p class="one">${md(t.one)}</p></section>`;

  if (t.mark && D.marks[t.mark])
    h += `<p class="note"><b>${t.mark}</b> Two interfaces, depending on how you call it: ${D.marks[t.mark]}</p>`;

  if (t.caps.length){
    const n = t.caps.reduce((a, [, cs]) => a + cs.length, 0);
    h += `<section><h2>What it can do &nbsp;·&nbsp; ${n} commands</h2>`;
    for (const [g, cs] of t.caps){
      h += `<div class="capgrp"><h3>${md(g)}</h3><div class="cmds">`;
      for (const [c, w] of cs)
        h += `<button class="cmd" data-copy="${esc(c)}"><span class="c">${esc(c)}</span>
              <span class="w">${md(w)}</span></button>`;
      h += `</div></div>`;
    }
    h += `</section>`;
  }

  h += `<section><h2>What this interface can never tell you</h2>
        <p class="blind"><b>${IFACE_LABEL[t.iface]}</b> — <code>${esc(info.sig)}</code>.
        ${info.blind}</p></section>`;

  if (t.course.length)
    h += `<section><h2>As the course runs it &nbsp;·&nbsp; ${t.course.length} commands,
          taken apart</h2><div class="ctable">` +
      t.course.map(c => `<div class="crow">
        <div class="l">${esc(c.lesson || c.act || "")}</div>
        <div class="c">${esc(c.cmd)}</div><div class="w">${md(c.why)}</div></div>`).join("") +
      `</div></section>`;

  if (sibs.length)
    h += `<section><h2>Same interface — shares its grammar and its blind spot</h2>
      <div class="sibs">` +
      sibs.map(s => `<button class="sib" data-id="${esc(s.id)}">${esc(s.id)}</button>`).join("") +
      `</div></section>`;

  pane.innerHTML = h + `</div>`;
  pane.scrollTop = 0;
}

function render(){ drawFilters(); drawList(); drawPane(); }

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip){
    const {k, v} = chip.dataset;
    if (k === "iface") fIface.has(v) ? fIface.delete(v) : fIface.add(v);
    if (k === "mode")  fMode.has(v)  ? fMode.delete(v)  : fMode.add(v);
    if (k === "roster") fRoster = !fRoster;
    render(); return;
  }
  const pick = e.target.closest("[data-id]");
  if (pick){ sel = pick.dataset.id; render(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp && navigator.clipboard){
    navigator.clipboard.writeText(cp.dataset.copy).then(() => {
      const el = document.getElementById("copied");
      el.textContent = "copied — " + cp.dataset.copy.slice(0, 46);
      el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1200);
    });
  }
});

const input = document.getElementById("q");
input.addEventListener("input", () => { q = input.value.trim().toLowerCase(); drawList(); });

document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input){ e.preventDefault(); input.focus(); return; }
  if (e.key === "Escape" && document.activeElement === input){ input.value = ""; q = ""; drawList(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    const shown = D.tools.filter(matches);
    if (!shown.length) return;
    e.preventDefault();
    let i = shown.findIndex(t => t.id === sel);
    i = e.key === "ArrowDown" ? Math.min(shown.length - 1, i + 1) : Math.max(0, i - 1);
    sel = shown[i].id; render();
    document.querySelector('.item[aria-current="true"]')
      ?.scrollIntoView({block: "nearest"});
  }
});

render();
</script>
