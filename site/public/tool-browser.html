<title>Instrument Panel</title>
<style>
:root{
  --ground:#eaeef2; --surface:#fff; --surface-2:#f4f7f9; --ink:#151a20; --ink-2:#3d4854;
  --muted:#66727f; --line:#d3dae1; --line-2:#e5eaef;
  --accent:#255c8a; --accent-soft:#e2ecf5; --on-accent:#fff;
  --read:#3f7452; --read-soft:#e4efe8;
  --mutate:#95552a; --mutate-soft:#f7ebe0;
  --live:#0c6f7d; --live-soft:#e0f0f2;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px -12px rgba(20,30,40,.14);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1216; --surface:#161b21; --surface-2:#1c222a; --ink:#e7edf3; --ink-2:#c2cdd8;
  --muted:#8a97a6; --line:#28303a; --line-2:#212831;
  --accent:#74b0e2; --accent-soft:#16293a; --on-accent:#0b0f13;
  --read:#79bd95; --read-soft:#17281e;
  --mutate:#dda06a; --mutate-soft:#2b2016;
  --live:#54c4d1; --live-soft:#0f2a2e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0e1216; --surface:#161b21; --surface-2:#1c222a; --ink:#e7edf3; --ink-2:#c2cdd8;
  --muted:#8a97a6; --line:#28303a; --line-2:#212831;
  --accent:#74b0e2; --accent-soft:#16293a; --on-accent:#0b0f13;
  --read:#79bd95; --read-soft:#17281e;
  --mutate:#dda06a; --mutate-soft:#2b2016;
  --live:#54c4d1; --live-soft:#0f2a2e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font-family:var(--mono)}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);height:100vh;height:100dvh}

/* ---- rail ---- */
.rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);
  background:var(--surface)}
.railhead{padding:16px 16px 12px;border-bottom:1px solid var(--line-2);display:flex;
  flex-direction:column;gap:12px}
.brand{font:600 12px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:600}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);
  font:13px/1.3 var(--sans)}
.search input::placeholder{color:var(--muted)}
.search kbd{font:11px/1 var(--mono);color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:11px/1 var(--mono);padding:5px 8px;border-radius:20px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600}
.chip.m-read[aria-pressed="true"]{background:var(--read);border-color:var(--read);color:var(--on-accent)}
.chip.m-mutate[aria-pressed="true"]{background:var(--mutate);border-color:var(--mutate);color:var(--on-accent)}
.chip.m-live[aria-pressed="true"]{background:var(--live);border-color:var(--live);color:var(--on-accent)}

.list{flex:1;min-height:0;overflow-y:auto;padding:8px 8px 32px;scrollbar-width:thin}
.grp{font:600 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  padding:16px 8px 7px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp span{font-family:var(--mono);letter-spacing:0;font-weight:400;opacity:.75}
.item{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:6px 9px;
  border-radius:6px;border-left:2px solid transparent}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.item .nm{font:13px/1.35 var(--mono);color:var(--ink)}
.item[aria-current="true"] .nm{color:var(--accent);font-weight:600}
.item .dots{margin-left:auto;display:flex;gap:3px;flex-shrink:0;padding-top:5px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.read{background:var(--read)} .dot.mutate{background:var(--mutate)} .dot.live{background:var(--live)}
.item .rk{font:10px/1 var(--mono);color:var(--muted);opacity:.7;flex-shrink:0;padding-top:4px}
.empty{padding:24px 12px;color:var(--muted);font-size:13px}

/* ---- detail ---- */
.pane{min-height:0;overflow-y:auto;padding:0}
.wrap{max-width:820px;margin:0 auto;padding:40px 40px 96px}
.hd{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;
  border-bottom:1px solid var(--line)}
h1{margin:0;font:600 30px/1.1 var(--mono);letter-spacing:-.02em;text-wrap:balance}
.expand{margin:0;color:var(--muted);font-size:14px}
.facets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.tag{font:11px/1 var(--mono);padding:5px 9px;border-radius:5px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface)}
.tag.if{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.tag.read{border-color:var(--read);color:var(--read);background:var(--read-soft)}
.tag.mutate{border-color:var(--mutate);color:var(--mutate);background:var(--mutate-soft)}
.tag.live{border-color:var(--live);color:var(--live);background:var(--live-soft)}
.tag.roster{border-style:dashed;color:var(--muted)}

section{margin-top:34px}
h2{margin:0 0 12px;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted)}
.one{margin:0;padding:16px 18px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:4px;font-size:14.5px;color:var(--ink-2);
  box-shadow:var(--shadow)}
.one code{font-size:.9em;background:var(--surface-2);padding:1px 4px;border-radius:3px}
.one strong{color:var(--ink)}

.capgrp{margin-bottom:22px}
.capgrp h3{margin:0 0 8px;font:600 13.5px/1.35 var(--sans);color:var(--ink);text-wrap:balance}
.cmds{display:flex;flex-direction:column;gap:1px;background:var(--line-2);
  border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cmd{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:10px 12px;
  background:var(--surface);text-align:left;width:100%;transition:background .1s}
.cmd:hover{background:var(--surface-2)}
.cmd .c{font:12.5px/1.5 var(--mono);color:var(--accent);word-break:break-word}
.cmd .w{font-size:12.5px;color:var(--muted);line-height:1.45}
.cmd .w code{font-size:.94em}
.copied{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);
  color:var(--ground);font:12px/1 var(--mono);padding:9px 14px;border-radius:6px;opacity:0;
  transition:opacity .18s;pointer-events:none;z-index:20}
.copied.on{opacity:1}

.blind{margin:0;padding:14px 16px;border:1px dashed var(--line);border-radius:5px;
  color:var(--ink-2);font-size:13.5px;background:var(--surface-2)}
.blind b{color:var(--ink)}
.note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.sibs{display:flex;flex-wrap:wrap;gap:6px}
.sib{font:12px/1 var(--mono);padding:6px 10px;border-radius:5px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface)}
.sib:hover{border-color:var(--accent);color:var(--accent)}
.ctable{display:flex;flex-direction:column;gap:1px;background:var(--line-2);
  border:1px solid var(--line);border-radius:6px;overflow:hidden}
.crow{padding:10px 12px;background:var(--surface)}
.crow .c{font:12.5px/1.5 var(--mono);color:var(--ink-2);word-break:break-word}
.crow .w{font-size:12.5px;color:var(--muted);margin-top:3px}
.crow .l{font:10px/1 var(--mono);color:var(--muted);opacity:.7;text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:5px}

.mobile-only{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:34vh}
  .wrap{padding:26px 20px 80px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="rail">
    <div class="railhead">
      <div class="brand"><b>Instrument Panel</b> &nbsp;73 tools</div>
      <label class="search">
        <input id="q" type="search" placeholder="Search tools, capabilities, commands…"
               autocomplete="off" aria-label="Search">
        <kbd>/</kbd>
      </label>
      <div class="filters" id="filters"></div>
    </div>
    <div class="list" id="list" role="listbox" aria-label="Tools"></div>
  </div>
  <div class="pane" id="pane"></div>
</div>
<div class="copied" id="copied">copied</div>

<script>
const D = {"tools":[{"id":"bridge","label":"`bridge`","names":["bridge"],"expand":"—","one":"A bridge's forwarding database (`fdb`), its VLAN filtering table, and per-port state. `ip` creates bridges; only this inspects them","iface":"netlink","mark":"","grammar":"obj-verb","mode":["mutate","live"],"taught":"veth and bridge","section":"Reading the kernel's network state","caps":[["The forwarding database",[["bridge fdb show","MAC to port — what the bridge has learned"],["bridge fdb show br br0","one bridge only"],["bridge fdb add <mac> dev <port> master","a static entry"]]],["Ports and their state",[["bridge link show","per-port state, STP role, and which bridge each belongs to"],["bridge link set dev <port> learning off","stop learning on one port"]]],["VLAN filtering",[["bridge vlan show","the per-port VLAN table — invisible to ip"],["bridge vlan add dev <port> vid 10 pvid untagged","put a port in a VLAN"]]],["Watch it change",[["bridge monitor","stream fdb and port events"]]]],"course":[{"cmd":"bridge fdb show br br0","why":"the **forwarding database**: which MAC was last seen on which port. `ip` can create a bridge; only `bridge` can show you this","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"}]},{"id":"conntrack","label":"`conntrack`","names":["conntrack"],"expand":"connection tracking","one":"The kernel's flow table as a live stream (`-E`), which is the only way to watch NAT decisions happen","iface":"netlink","mark":"","grammar":"flags","mode":["mutate","live"],"taught":"conntrack","section":"Reading the kernel's network state","caps":[["Read the flow table",[["conntrack -L","every tracked flow, with both the original and the reply tuple"],["conntrack -L -p tcp --dport 443","filtered"],["conntrack -C","just the count — the number that hits nf_conntrack_max"]]],["Watch NAT decisions happen",[["conntrack -E","stream NEW/UPDATE/DESTROY — the only way to see a translation being made"],["conntrack -E -e NEW","only new flows"]]],["Change it",[["conntrack -D -p tcp --dport 443","delete matching entries; the next packet is re-evaluated"],["conntrack -F","flush everything — blunt, and it breaks live connections"]]],["Counters",[["conntrack -S","per-CPU stats: insert_failed and drop are the ones that matter"]]]],"course":[{"cmd":"conntrack -E -p tcp","why":"`-E` = **event mode**: stream flows as they change, rather than dumping the table. `-p tcp` filters by protocol. The only way to watch a NAT decision being made","act":"Act III — The internet","lesson":"Lesson 2b — conntrack"},{"cmd":"conntrack -C","why":"`-C` = count the flows tracked right now. opt: `-L` to list them, `-D` to delete one","act":"Act III — The internet","lesson":"Lesson 2b — conntrack"}]},{"id":"devlink","label":"`devlink`","names":["devlink"],"expand":"*no documented expansion*","one":"Hardware-level device and port config below what `ip link` can reach","iface":"netlink","mark":"","grammar":"obj-verb","mode":["mutate","live"],"taught":null,"section":"Reading the kernel's network state","caps":[["Below what ip link can reach",[["devlink dev show","the hardware devices behind the netdevs"],["devlink port show","physical ports and their split configuration"],["devlink dev param show","device-level tunables"],["devlink monitor","stream device events"]]]],"course":[]},{"id":"ethtool","label":"`ethtool`","names":["ethtool"],"expand":"\"ethernet tool\" *(folklore — undocumented)*","one":"The NIC's own truth: link speed, ring sizes, offloads (`-k`), and per-queue hardware counters (`-S`). Explains why `tcpdump` shows a 64 KB \"packet\" on a 1500-byte link","iface":"netlink","mark":"","grammar":"flags","mode":["mutate"],"taught":null,"section":"Reading the kernel's network state","caps":[["What the NIC really is",[["ethtool <dev>","negotiated speed, duplex, link detected — the physical truth"],["ethtool -i <dev>","driver and firmware version"]]],["Offloads — why tcpdump lies about packet size",[["ethtool -k <dev>","every offload feature and whether it is on"],["ethtool -K <dev> tso off gro off","turn them off, and captures show 1500-byte packets again"]]],["Hardware counters and queues",[["ethtool -S <dev>","per-queue drops and errors the kernel counters do not show"],["ethtool -g <dev>","ring buffer sizes — undersized rings appear as rx_no_buffer"],["ethtool -l <dev>","queue counts"]]]],"course":[]},{"id":"ip","label":"`ip`","names":["ip"],"expand":"internet protocol utility","one":"Everything netlink's route family knows: links, addresses, routes, neighbours, rules, namespaces. `-j` gives it to you as JSON","iface":"netlink","mark":"","grammar":"obj-verb, 30 objects","mode":["mutate","live"],"taught":"ethernet and ARP","section":"Reading the kernel's network state","caps":[["Links — interfaces and their state",[["ip link show","every interface: index, MAC, MTU, flags, oper state"],["ip -d link show <dev>","-d adds the kind: veth, bridge, vxlan, dummy, bond"],["ip link add v0 type veth peer name v1","create a virtual cable — both ends at once"],["ip link set <dev> up | mtu 1400 | master br0","bring up, resize, enslave to a bridge"],["ip link set <dev> netns blue","move an interface into another namespace — it vanishes from here"]]],["Addresses",[["ip addr show","every address on every interface, with scope and lifetime"],["ip -br addr","one line per interface — the form you actually read"],["ip addr add 10.0.0.1/24 dev <dev>","fails with EEXIST if it is already there"],["ip addr replace 10.0.0.1/24 dev <dev>","same end state either way — the idempotent form"],["ip addr flush dev <dev>","remove all of them"]]],["Routes — how the kernel picks an exit",[["ip route show","the main table"],["ip route get 8.8.8.8","the decision for one destination: which route, source and device"],["ip route add 10.2.0.0/24 via 10.0.0.2 dev <dev>","a static route"],["ip route show table all","every table, not just main — where policy routing hides"],["ip route add default via <gw> metric 200","a second default, lower priority"]]],["Neighbours — the ARP/NDP cache",[["ip neigh show","IP to MAC, with state: REACHABLE, STALE, FAILED"],["ip neigh del <ip> dev <dev>","force the next packet to re-ARP — the standard poke"],["ip neigh add <ip> lladdr <mac> dev <dev> nud permanent","a static entry"]]],["Policy routing — more than one table",[["ip rule show","which table is consulted for which traffic, in priority order"],["ip rule add from 10.0.0.5 table 100","source-based routing, the basis of multi-homing"]]],["Watch it change",[["ip monitor","stream every netlink event: links, addresses, routes, neighbours"],["ip monitor route","route changes only — catches a flap you could never poll fast enough for"]]],["Output options that work on every object",[["ip -j -p link show","JSON, pretty-printed — then jq, instead of guessing at awk"],["ip -6 route show","restrict to one address family"],["ip -s link show <dev>","counters; -s -s gives more again"],["ip -n blue addr","run the whole command inside namespace blue"]]]],"course":[{"cmd":"ip addr show lo","why":"`ip` = the iproute2 tool; `addr` = the **object** (addresses); `show` = the **verb**; `lo` = which device. opt: `ip a` short form, `ip -br addr` one line per device","act":"Act I — One machine talking to itself","lesson":"Lesson 4 — The loopback interface"},{"cmd":"ip addr show eth0","why":"the same for the real NIC. opt: `-4` to drop the IPv6 lines","act":"Act I — One machine talking to itself","lesson":"Lesson 4 — The loopback interface"},{"cmd":"ip -s link show eth0","why":"`-s` = statistics. opt: `-s -s` **stacks** for per-error-type detail","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"},{"cmd":"ip -4 addr show eth0","why":"your address and its prefix length, IPv4 only","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"},{"cmd":"ip neigh flush dev eth0","why":"`neigh` = the neighbour object; `flush` = empty it; `dev eth0` = scoped to one device. Makes the next ping re-ARP so you can watch it happen","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"},{"cmd":"ip neigh","why":"the replacement. With no verb, `show` is implied — true for most `ip` objects","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"},{"cmd":"ip link add link eth0 name eth0.10 type vlan id 10","why":"`link add` = create a device; the inner `link eth0` = its **parent**; `name` = what to call it; `type vlan` picks the kind; `id 10` = the 12-bit VLAN tag. The `.10` naming is convention, not a requirement","act":"Act II — Two machines on one wire","lesson":"Lesson 1b — VLANs and segmentation"},{"cmd":"ip -d link show eth0.10","why":"`-d` = details, which is what reveals `vlan protocol 802.1Q id 10`. Without `-d` the VLAN-ness is invisible","act":"Act II — Two machines on one wire","lesson":"Lesson 1b — VLANs and segmentation"},{"cmd":"ip route show default","why":"just the catch-all route","act":"Act II — Two machines on one wire","lesson":"Lesson 2 — IP and routing"},{"cmd":"ip route get 8.8.8.8","why":"**the decision, not the table.** Asks the kernel \"which route would you use, out which device, from which source address\" — the single most useful routing command","act":"Act II — Two machines on one wire","lesson":"Lesson 2 — IP and routing"},{"cmd":"ip route get 127.0.0.1","why":"the same for loopback, which resolves via a different table entirely","act":"Act II — Two machines on one wire","lesson":"Lesson 2 — IP and routing"},{"cmd":"ip route show","why":"note the `proto` word on the rows that have one: who installed this route — `kernel`, `static`, `bgp`, `dhcp`. A route added with no explicit origin is `boot`, and iproute2 prints **nothing** for it — which is why the default route, the first row everyone reads, usually has no `proto` at all","act":"Act II — Two machines on one wire","lesson":"Lesson 2b — Routing protocols and BGP"},{"cmd":"ip route add 203.0.113.0/24 dev eth0 proto bgp","why":"`add` = the verb; `dev eth0` = out which device; `proto bgp` **labels** the origin. Nothing verifies the label — you're pretending a daemon did it","act":"Act II — Two machines on one wire","lesson":"Lesson 2b — Routing protocols and BGP"},{"cmd":"ip route show proto bgp","why":"filter by origin. Any field on the route object can usually be used as a filter","act":"Act II — Two machines on one wire","lesson":"Lesson 2b — Routing protocols and BGP"},{"cmd":"ip route add blackhole 208.65.153.0/24","why":"`blackhole` = a route that silently discards. The BGP hijack, reproduced: a more specific prefix wins over a less specific one regardless of who announced it","act":"Act II — Two machines on one wire","lesson":"Lesson 2b — Routing protocols and BGP"},{"cmd":"ip route get 208.65.153.10","why":"which of the two competing routes wins, decided by prefix length. **Expect an error:** when the blackhole wins, this prints `RTNETLINK answers: Invalid argument` and exits 2. That error *is* the answer — the kernel chose the route that discards. Compare an address inside the wider prefix but outside the hijacked one, which still resolves normally","act":"Act II — Two machines on one wire","lesson":"Lesson 2b — Routing protocols and BGP"},{"cmd":"ip route del <prefix>","why":"`del` — and note you do **not** repeat the `dev`/`proto` attributes to delete","act":"Act II — Two machines on one wire","lesson":"Lesson 2b — Routing protocols and BGP"},{"cmd":"ip link set eth0 mtu 1500","why":"**do this first.** The pair below assumes a 1500-byte path, and on Docker Desktop `eth0` comes up at MTU 65535, where both sizes succeed and the lesson silently does not happen","act":"Act II — Two machines on one wire","lesson":"Lesson 3b — MTU and fragmentation"},{"cmd":"ip link add veth0 type veth peer name veth1","why":"`type veth` = a virtual Ethernet **pair**; `peer name` names the other end. Always two, like the two plugs of one cable","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip link set veth1 netns ns1","why":"`set` = the verb; `netns <name>` moves the device **into** a namespace. It vanishes from the host's `ip link` — a device belongs to exactly one namespace","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip addr add 10.10.0.1/24 dev veth0","why":"adds the address, and the kernel installs the directly-connected route for the whole `/24` **when the interface comes up** — `proto kernel`, because you did not write it. That route, not any `ip route` command, is what makes the first ping work. Check `ip route` straight after this line and you will see nothing: bring the link up and it appears, carrying `linkdown` until the peer is up too","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip link set veth0 up","why":"interfaces start administratively down. Both ends must be up","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip link add br0 type bridge","why":"a software switch","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip link set veth-a master br0","why":"`master` = enslave this device to that bridge — the equivalent of plugging a cable into a switch port. Visible afterwards as `/sys/class/net/br0/brif/veth-a`","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip link del veth-a","why":"deleting one end deletes the pair, including the end inside a namespace","act":"Act IV — One machine pretends to be many","lesson":"Lesson 2 — veth and bridge"},{"cmd":"ip link show docker0","why":"the bridge Docker created for you: exactly lesson 2's `br0`, under a different name","act":"Act IV — One machine pretends to be many","lesson":"Lesson 3 — iptables and NAT"},{"cmd":"ip link add vxlan0 type vxlan id 42 local 172.31.0.1 remote 172.31.0.2 dstport 4789 dev vu1","why":"`type vxlan`; `id 42` = the VNI, the tenant identifier; `local`/`remote` = the **underlay** endpoints; `dstport 4789` = the standard VXLAN UDP port (Flannel uses 8472); `dev` = which device carries the outer packet","act":"Act IV — One machine pretends to be many","lesson":"Lesson 4 — Overlay and VXLAN"},{"cmd":"ip -d link show vxlan0","why":"`-d` again: without it, none of the `vxlan id 42 local … remote …` detail prints","act":"Act IV — One machine pretends to be many","lesson":"Lesson 4 — Overlay and VXLAN"},{"cmd":"ip link set vu2 mtu 1400","why":"shrink the underlay MTU to break the overlay — the failure every real overlay eventually hits","act":"Act IV — One machine pretends to be many","lesson":"Lesson 4 — Overlay and VXLAN"},{"cmd":"ip -s link show vu2","why":"the RX `dropped` counter climbing with each large ping. **The evidence that a silent drop is happening**, and where to look for it","act":"Act IV — One machine pretends to be many","lesson":"Lesson 4 — Overlay and VXLAN"},{"cmd":"ip link set vxlan0 mtu 1350","why":"the fix: the overlay MTU must leave room for the outer headers. 1400 − 50 for VXLAN = 1350","act":"Act IV — One machine pretends to be many","lesson":"Lesson 4 — Overlay and VXLAN"}]},{"id":"ipset","label":"`ipset`","names":["ipset"],"expand":"IP set","one":"Hash sets of addresses/ports that iptables can match in one step instead of rule-by-rule. Now largely historical: nftables has native sets and maps, and `ipset` is unmaintained and slated for removal on RHEL","iface":"netlink","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":null,"section":"Filtering, NAT and traffic shaping","caps":[["Sets iptables can match in one step",[["ipset create bad hash:ip","a hash set of addresses"],["ipset add bad 10.0.0.1","populate"],["ipset list bad","read it back"],["iptables -A INPUT -m set --match-set bad src -j DROP","one rule instead of thousands"]]]],"course":[]},{"id":"iptables","label":"`iptables`","names":["iptables"],"expand":"IP tables","one":"The legacy rule syntax that most of the internet's documentation, and `kube-proxy`'s default mode, still speaks. **Run `iptables -V` first:** since 1.8 the same CLI sits over two different kernel backends and prints either `(nf_tables)` or `(legacy)`. Never mix the legacy and nft tools — both subsystems become active and the evaluation order between them is undefined","iface":"netlink","mark":"†","grammar":"flags (`-t -A -m -j`)","mode":["mutate"],"taught":"iptables and NAT","section":"Filtering, NAT and traffic shaping","caps":[["Read a ruleset",[["iptables -V","run this FIRST: prints (nf_tables) or (legacy) — two different kernel backends"],["iptables -t nat -L -n -v --line-numbers","one table, numeric, with counters and rule numbers"],["iptables -L -n -v","the filter table"]]],["The five tables, and what each is for",[["iptables -t filter …","accept/drop — the default"],["iptables -t nat …","translation: PREROUTING (DNAT), POSTROUTING (SNAT/MASQUERADE)"],["iptables -t mangle …","rewrite packet fields, set marks"],["iptables -t raw …","NOTRACK — the only place to opt out of conntrack"],["iptables -t security …","SELinux/MAC labels"]]],["Write rules",[["iptables -t nat -A POSTROUTING -s 10.0.0.0/24 -j MASQUERADE","the container-networking rule"],["iptables -I INPUT 1 -p tcp --dport 22 -j ACCEPT","-I inserts at a position; -A appends"],["iptables -D INPUT 1","delete by line number"],["iptables -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT","-m loads a match module"]]],["Read and restore atomically",[["iptables-save > rules.v4","the whole ruleset as diffable text — the only sane way to read a big one"],["iptables-restore < rules.v4","applied atomically; a partial ruleset is never live"]]]],"course":[{"cmd":"iptables -t nat -L -n -v","why":"`-t nat` = which **table** (`nat` rewrites addresses, `filter` accepts/drops); `-L` = list; `-n` = numeric, no DNS; `-v` = verbose, which adds the packet and byte counters — the column that tells you whether a rule is actually being hit","act":"Act IV — One machine pretends to be many","lesson":"Lesson 3 — iptables and NAT"},{"cmd":"iptables -t filter -L -n -v --line-numbers","why":"`--line-numbers` gives you the index you need to delete a rule by position","act":"Act IV — One machine pretends to be many","lesson":"Lesson 3 — iptables and NAT"},{"cmd":"iptables -t nat -L POSTROUTING -n -v","why":"one **chain**: `POSTROUTING` is the last hook before a packet leaves, which is where source NAT has to happen","act":"Act IV — One machine pretends to be many","lesson":"Lesson 3 — iptables and NAT"},{"cmd":"iptables -t nat -L DOCKER -n","why":"Docker's own chain, holding the `DNAT tcp dpt:8080 to:172.17.x.x:80` that `-p` created","act":"Act IV — One machine pretends to be many","lesson":"Lesson 3 — iptables and NAT"},{"cmd":"iptables -L FORWARD -n --line-numbers","why":"the chain that decides whether traffic may be routed *through* this host — the rules that make container-to-outside work","act":"Act IV — One machine pretends to be many","lesson":"Lesson 3 — iptables and NAT"}]},{"id":"iptables-save","label":"`iptables-save`","names":["iptables-save"],"expand":"—","one":"The whole ruleset in one atomic, diffable text dump — the only sane way to read a large ruleset","iface":"netlink","mark":"†","grammar":"flags","mode":["read-only"],"taught":"services","section":"Filtering, NAT and traffic shaping","caps":[["The whole ruleset as diffable text",[["iptables-save","every table at once, atomically consistent"],["iptables-save -t nat | grep KUBE-SVC","how you read kube-proxy's output without going mad"],["iptables-save > before.txt","the before half of a diff — the honest way to see what a controller changed"]]]],"course":[]},{"id":"ipvsadm","label":"`ipvsadm`","names":["ipvsadm"],"expand":"IP virtual server admin","one":"The IPVS connection and destination tables (`/proc/net/ip_vs`, `ip_vs_conn`) when `kube-proxy` runs in IPVS mode — still the right way to read a cluster that inherited it. Note the split: **IPVS in Linux is not deprecated; `kube-proxy`'s IPVS *mode* is** — deprecated in Kubernetes 1.35, with removal targeted at 1.43. `kube-proxy`'s nftables mode went GA in 1.33, though iptables remains the default","iface":"netlink","mark":"","grammar":"flags","mode":["mutate"],"taught":null,"section":"Filtering, NAT and traffic shaping","caps":[["The IPVS tables",[["ipvsadm -L -n","virtual services and their real servers, with weights"],["ipvsadm -L -n --stats","per-service packet and byte counters"],["ipvsadm -l -n -c","the live connection table — which client is pinned to which backend"],["cat /proc/net/ip_vs_conn","the same table, as a file"]]]],"course":[]},{"id":"nft","label":"`nft`","names":["nft"],"expand":"nftables — netfilter tables","one":"One tool and one grammar for IPv4, IPv6, ARP and bridge (the `inet` family), plus the sets and maps that iptables needed `ipset` for. In-kernel since 3.13; netfilter's own wiki has called the xtables tools legacy since 2018, RHEL 10 no longer ships the legacy `ip_tables` module at all, and Docker Engine 29 has an experimental native nftables backend it intends to make the default","iface":"netlink","mark":"","grammar":"verb-obj","mode":["mutate","live"],"taught":null,"section":"Filtering, NAT and traffic shaping","caps":[["Read everything at once",[["nft list ruleset","every table, chain and rule in one output — no per-table loop"],["nft -a list ruleset","with handles, which is how you delete a specific rule"],["nft -j list ruleset","JSON"]]],["One grammar for all families",[["nft add table inet filter","inet covers IPv4 and IPv6 together — the thing iptables cannot do"],["nft add chain inet filter input '{ type filter hook input priority 0; policy drop; }'","a base chain, hook and policy declared inline"]]],["Native sets and maps — no ipset needed",[["nft add set inet filter bad '{ type ipv4_addr; flags interval; }'","a typed set"],["nft add element inet filter bad '{ 10.0.0.0/8, 192.168.1.1 }'","populate it"],["nft add rule inet filter input ip saddr @bad drop","match the whole set in one rule"]]],["Watch it change",[["nft monitor","stream ruleset changes — see what an orchestrator is writing"]]]],"course":[]},{"id":"ss","label":"`ss`","names":["ss"],"expand":"*\"another utility to investigate sockets\"* — \"socket statistics\" is *(folklore)*","one":"Per-socket TCP internals: RTT, cwnd, retransmits (`-i`) and buffer accounting (`-m`). Also `--cgroup`, which attributes a socket to its cgroup — i.e. **to a container, without touching the container runtime** — and `-E` to stream sockets as they are destroyed, catching short-lived connections a polling loop misses","iface":"netlink","mark":"","grammar":"flags + *filter*","mode":["live"],"taught":"ports and /proc/net/tcp","section":"Reading the kernel's network state","caps":[["Which sockets exist",[["ss -tuln","TCP+UDP, listening, numeric — the first command on any strange box"],["ss -tanp","all TCP with the owning process"],["ss -s","a summary count by state and family"]]],["TCP internals no other tool exposes",[["ss -ti","RTT, cwnd, retransmits, pacing — per socket"],["ss -tm","send/receive buffer accounting, which is where \"slow\" often lives"]]],["Attribute a socket to a container",[["ss --cgroup -tanp","the cgroup path per socket — the container, without asking the runtime"]]],["Catch short-lived connections",[["ss -E","stream sockets as they are destroyed; a polling loop misses these entirely"]]],["Its own filter language",[["ss -tan state established '( dport = :443 or sport = :443 )'","expressions, not grep"],["ss -tan 'dst 10.0.0.0/8'","by network"]]]],"course":[{"cmd":"ss -tlnp","why":"`-t` TCP; `-l` listening only; `-n` numeric (don't resolve service names); `-p` show the owning process. opt: drop `-l` for all states, `-u` for UDP, `-x` for Unix sockets","act":"Act I — One machine talking to itself","lesson":"Lesson 5 — Ports and /proc/net/tcp"},{"cmd":"ss -tan","why":"`-a` = **all** states, not just listening; the `State` column is `/proc/net/tcp`'s `st` field spelled out","act":"Act I — One machine talking to itself","lesson":"Lesson 5b — TCP states and the SYN scan"},{"cmd":"ss -tan state time-wait","why":"`state time-wait` is **`ss`'s own filter language**, not a flag — and not libpcap's. opt: `state established`, `state syn-sent`, or `state connected` for a group","act":"Act III — The internet","lesson":"Lesson 2 — TCP states"},{"cmd":"ss -tmi dst :8080","why":"`-m` = socket memory; `-i` = internal TCP info; `dst :8080` = a filter on the destination. Together: buffers and congestion state for one connection","act":"Act III — The internet","lesson":"Lesson 3 — TCP and reliability"},{"cmd":"ss -ti dst :80","why":"the same values with names attached, including `rtt`, `retrans` and the congestion algorithm","act":"Act III — The internet","lesson":"Lesson 3 — TCP and reliability"}]},{"id":"tc","label":"`tc`","names":["tc"],"expand":"traffic control","one":"Queueing, rate limits, and — via `netem` — deliberately injected loss, delay, reordering and duplication. **The only way to *reproduce* a bad network**, and `netem` has no eBPF equivalent. eBPF did not replace `tc`; it replaced one thing that used to hang off it, the packet classifier. Modern eBPF datapath programs attach straight to a device's ingress and egress (an interface called TCX, since kernel 6.6) instead of hanging off one of `tc`'s queueing disciplines","iface":"netlink","mark":"","grammar":"obj-verb (qdisc/class/filter)","mode":["mutate","live"],"taught":null,"section":"Filtering, NAT and traffic shaping","caps":[["See the queueing discipline",[["tc qdisc show","every qdisc on every device"],["tc -s qdisc show dev <dev>","with drop and backlog counters — where loss actually appears"],["tc class show dev <dev>","the class hierarchy under a classful qdisc"],["tc filter show dev <dev>","the classifiers, including attached eBPF programs"]]],["Reproduce a bad network — nothing else can do this",[["tc qdisc add dev <dev> root netem delay 100ms 20ms","100ms latency with 20ms jitter"],["tc qdisc add dev <dev> root netem loss 5%","drop one packet in twenty"],["tc qdisc add dev <dev> root netem reorder 25% 50%","reorder — the one that breaks naive protocols"],["tc qdisc add dev <dev> root netem duplicate 1%","duplicates"],["tc qdisc del dev <dev> root","undo it — know this one before you run the others"]]],["Rate limiting",[["tc qdisc add dev <dev> root tbf rate 1mbit burst 32kbit latency 400ms","a token bucket"],["tc qdisc add dev <dev> root handle 1: htb default 10","hierarchical shaping, the classful route"]]],["Watch it change",[["tc monitor","stream qdisc and filter events"]]]],"course":[]},{"id":"wg","label":"`wg`","names":["wg"],"expand":"WireGuard","one":"The live tunnel state — peers, handshakes, keys — under Cilium's or anyone else's encryption","iface":"netlink","mark":"","grammar":"verb-obj","mode":["mutate"],"taught":"encryption between Pods","section":"Container and cluster runtimes","caps":[["Live tunnel state",[["wg show","peers, public keys, allowed IPs, last handshake, bytes"],["wg show <dev> latest-handshakes","the field that says whether a peer is actually alive"],["wg genkey | tee priv | wg pubkey","a keypair"],["wg setconf <dev> <file>","apply a configuration"]]]],"course":[]},{"id":"apparmor_parser","label":"`apparmor_parser`","names":["apparmor_parser"],"expand":"—","one":"Whether a profile loads, and in what mode — the difference between \"enforcing\" and \"you thought it was enforcing\"","iface":"procfs","mark":"","grammar":"flags","mode":["mutate"],"taught":"the kernel says no","section":"Namespaces, cgroups, capabilities","caps":[["Enforcing, or only pretending to",[["apparmor_parser -r /etc/apparmor.d/<profile>","load or reload"],["apparmor_parser -Q /etc/apparmor.d/<profile>","parse without loading — a syntax check"],["cat /sys/kernel/security/apparmor/profiles","what is loaded, and in which mode"]]]],"course":[]},{"id":"arp","label":"`arp`","names":["arp"],"expand":"ARP cache tool","one":"Nothing `ip neigh` doesn't. Recognise it in old runbooks","iface":"procfs","mark":"","grammar":"flags","mode":["mutate"],"taught":"taught as `ip neigh`'s rival","section":"Reachability and paths","caps":[["Recognise it in old runbooks",[["arp -an","the cache, read from /proc/net/arp — not netlink, which is why it can disagree with ip neigh"],["arp -d <ip>","delete an entry"],["arp -s <ip> <mac>","a static entry"]]]],"course":[{"cmd":"arp -n","why":"the old tool. `-n` = numeric, don't reverse-resolve","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"}]},{"id":"capsh","label":"`capsh`","names":["capsh"],"expand":"capability shell","one":"Which Linux capabilities a process actually holds, decoded from `/proc/<pid>/status`'s `CapEff` bitmask","iface":"procfs","mark":"","grammar":"flags","mode":["mutate"],"taught":"what a container may do","section":"Namespaces, cgroups, capabilities","caps":[["Which capabilities a process really holds",[["capsh --print","the current set, decoded"],["capsh --decode=0x00000000a80425fb","turn a CapEff bitmask from /proc/<pid>/status into names"],["capsh --drop=cap_net_raw -- -c 'ping -c1 127.0.0.1'","prove a capability is what makes a thing work"]]]],"course":[]},{"id":"cat","label":"`cat`","names":["cat"],"expand":"concatenate","one":"The primary interface to `/proc` and `/sys`. Most of this course is `cat`","iface":"procfs","mark":"","grammar":"flags","mode":["read-only"],"taught":"throughout","section":"General-purpose, used here to read kernel state","caps":[["The primary interface to /proc and /sys",[["cat /proc/net/tcp","every TCP socket, in hex — what ss and netstat read"],["cat /proc/net/arp","the neighbour cache, as a file"],["cat /proc/sys/net/ipv4/ip_forward","a sysctl, as the file it actually is"],["cat /proc/<pid>/status","including CapEff, the capability bitmask"],["cat /sys/class/net/<dev>/mtu","one file per field — guessable paths"]]]],"course":[{"cmd":"cat /proc/self/fdinfo/1","why":"kernel metadata for fd **1**: `pos:` byte offset, `flags:` open mode, `ino:` the inode","act":"Act I — One machine talking to itself","lesson":"Lesson 1 — The file-descriptor table"},{"cmd":"cat /proc/interrupts","why":"per-device, per-CPU hardware interrupt counts","act":"Act I — One machine talking to itself","lesson":"Lesson 3 — Building minihttp, the listening server"},{"cmd":"cat /proc/net/dev","why":"per-interface RX/TX byte and packet counters. opt: `\\","act":"Act I — One machine talking to itself","lesson":"Lesson 4 — The loopback interface"},{"cmd":"cat /proc/net/tcp","why":"the raw TCP socket table *for this network namespace* — the path is a symlink to `self/net`, so it is never global. Addresses are hex and **little-endian** (byte-reversed): `0100007F` is `127.0.0.1`","act":"Act I — One machine talking to itself","lesson":"Lesson 5 — Ports and /proc/net/tcp"},{"cmd":"cat /sys/class/net/eth0/address","why":"the MAC, read straight from sysfs. One file per field is what makes `/sys` better than `/proc` to script against","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"},{"cmd":"cat /sys/class/net/eth0/statistics/rx_packets","why":"a single counter. Everything `ip -s link` prints lives as one file each under `statistics/`","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"},{"cmd":"cat /proc/net/vlan/config","why":"each VLAN interface with its parent and tag — the kernel's own view of what you just built","act":"Act II — Two machines on one wire","lesson":"Lesson 1b — VLANs and segmentation"},{"cmd":"cat /sys/class/net/eth0.10/address","why":"**the same MAC as the parent.** A VLAN interface is a tag, not a second network card","act":"Act II — Two machines on one wire","lesson":"Lesson 1b — VLANs and segmentation"},{"cmd":"cat /proc/net/route","why":"the main table in hex, little-endian like `/proc/net/tcp`","act":"Act II — Two machines on one wire","lesson":"Lesson 2 — IP and routing"},{"cmd":"cat /proc/net/udp","why":"the UDP table — the same shape as `/proc/net/tcp` but with no state column, because UDP has no states","act":"Act II — Two machines on one wire","lesson":"Lesson 3 — ICMP, UDP, and TTL"},{"cmd":"cat /sys/class/net/eth0/mtu","why":"the largest payload this device will carry","act":"Act II — Two machines on one wire","lesson":"Lesson 3b — MTU and fragmentation"},{"cmd":"cat /etc/resolv.conf","why":"the recursive resolver's address, the `search` list, and `ndots` — how many dots a name must contain before the resolver tries it as-is instead of appending each `search` domain first. The option behind most cluster DNS surprises","act":"Act II — Two machines on one wire","lesson":"Lesson 4 — DNS"},{"cmd":"cat /proc/self/cgroup","why":"`0::/` — this process's cgroup path, as seen from inside, where it is always the root","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1b — cgroups"},{"cmd":"cat /sys/fs/cgroup/cpu.max","why":"two numbers: quota and period. `50000 100000` = 50 ms of CPU per 100 ms, i.e. half a core","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1b — cgroups"},{"cmd":"cat /sys/fs/cgroup/memory.current","why":"live usage, which is what the limit is compared against","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1b — cgroups"},{"cmd":"cat /sys/fs/cgroup/memory.events","why":"`oom_kill` is no longer 0. **The evidence lives here**, not in the container's output","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1b — cgroups"},{"cmd":"cat /sys/fs/cgroup/cpu.stat","why":"`nr_throttled` and `throttled_usec` — the difference between \"slow code\" and \"code being held back by a quota\"","act":"Act IV — One machine pretends to be many","lesson":"Lesson 1b — cgroups"}]},{"id":"getpcaps","label":"`getpcaps`","names":["getpcaps"],"expand":"get process capabilities","one":"The same, for a running PID, in one line","iface":"procfs","mark":"","grammar":"`getpcaps <pid>`","mode":["read-only"],"taught":"Act X diagnose","section":"Namespaces, cgroups, capabilities","caps":[["The same, for a running PID, in one line",[["getpcaps <pid>","the decoded capability set"],["getpcaps 1","PID 1 in a container — usually more than you expected"]]]],"course":[]},{"id":"lsof","label":"`lsof`","names":["lsof"],"expand":"list open files","one":"The join from a socket back to *which process and which fd* owns it, across every process at once","iface":"procfs","mark":"","grammar":"flags","mode":["read-only"],"taught":"the fd table","section":"Reading the kernel's network state","caps":[["Join a socket back to a process and an fd",[["lsof -i","every network connection with its owning process"],["lsof -i :443","who holds this port"],["lsof -p <pid>","one process's open files and sockets, with their types"],["lsof -nP -i TCP -sTCP:LISTEN","listeners only, no name resolution"]]]],"course":[{"cmd":"lsof -p $(pgrep -n fd-demo)","why":"`lsof` (*list open files*); `-p <pid>` = one process's open files and sockets, with a `TYPE` column (`REG`, `IPv4`). Reads the same `/proc/<pid>/fd`. Needs real `lsof` (netlab) — netshoot's is a busybox stub","act":"Act I — One machine talking to itself","lesson":"Lesson 1 — The file-descriptor table"},{"cmd":"lsof -i :8080","why":"`-i` = internet sockets; `:8080` filters to that port. Needs real `lsof` (netlab)","act":"Act I — One machine talking to itself","lesson":"Lesson 5 — Ports and /proc/net/tcp"}]},{"id":"mount","label":"`mount` / `findmnt`","names":["mount","findmnt"],"expand":"—","one":"Which filesystems are grafted where; `findmnt` draws it as a tree with propagation flags","iface":"procfs","mark":"","grammar":"flags","mode":["mutate"],"taught":"everything is a file","section":"General-purpose, used here to read kernel state","caps":[["Which filesystem is grafted where",[["findmnt","the whole tree"],["findmnt -o TARGET,SOURCE,PROPAGATION","propagation flags — why a bind mount did or did not appear elsewhere"],["findmnt /run/netns","where ip netns keeps its namespaces"],["mount --bind /proc/<pid>/ns/net /run/netns/mine","make an unnamed namespace visible to ip netns"]]]],"course":[{"cmd":"mount","why":"every filesystem grafted into the tree, as `SOURCE on MOUNTPOINT type FSTYPE (options)`. `proc on /proc type proc` has no backing device. opt: `findmnt` draws it as a tree","act":"Act I — One machine talking to itself","lesson":"Lesson 6 — Everything is a file"}]},{"id":"netstat","label":"`netstat`","names":["netstat"],"expand":"network statistics","one":"Nothing `ss` doesn't, and structurally less: it reads `/proc/net/tcp`, whose kernel documentation says *\"these interfaces are deprecated in favor of tcp_diag\"*. Kept because it is on every legacy box and in every old runbook","iface":"procfs","mark":"","grammar":"flags","mode":["read-only"],"taught":"taught as `ss`'s rival","section":"Reading the kernel's network state","caps":[["Recognise it in old runbooks",[["netstat -tulnp","the ss -tulnp of its day; reads /proc/net/tcp"],["netstat -rn","the routing table — ip route in old shell scripts"],["netstat -i","per-interface counters"],["netstat -s","protocol statistics"]]]],"course":[{"cmd":"netstat -tlnp","why":"the tool `ss` replaced. Same flags, same idea — recognise it on legacy boxes, prefer `ss`","act":"Act I — One machine talking to itself","lesson":"Lesson 5 — Ports and /proc/net/tcp"}]},{"id":"nstat","label":"`nstat`","names":["nstat"],"expand":"network statistics","one":"Protocol counters from `/proc/net/snmp` and `netstat`, *as deltas since last call* — retransmits, listen overflows, drops","iface":"procfs","mark":"","grammar":"flags","mode":["read-only"],"taught":null,"section":"Reading the kernel's network state","caps":[["Counter deltas, not totals",[["nstat","everything that changed since the last call — retransmits, overflows, drops"],["nstat -az","absolute values, including zeros"],["nstat -a TcpExtListenDrops TcpRetransSegs","the two counters that explain most \"it hangs\" reports"]]]],"course":[]},{"id":"pgrep","label":"`pgrep`","names":["pgrep"],"expand":"process grep","one":"PID lookup by name, so `/proc/<pid>/…` paths can be built in one line","iface":"procfs","mark":"","grammar":"flags","mode":["read-only"],"taught":"the socket object","section":"General-purpose, used here to read kernel state","caps":[["PID lookup, so /proc paths can be built in one line",[["pgrep -n <name>","the newest matching PID"],["pgrep -f <pattern>","match the whole command line"],["ls -l /proc/$(pgrep -n minihttp)/fd","the composition that makes pgrep worth a row"]]]],"course":[{"cmd":"pgrep -n fd-demo","why":"`pgrep` (*process grep*) = find pids by name; `-n` = newest match only. opt: `-f` match the full command line, `-l` also print the name","act":"Act I — One machine talking to itself","lesson":"Lesson 2 — What a socket really is"}]},{"id":"readlink","label":"`readlink`","names":["readlink"],"expand":"—","one":"Reads a magic symlink's *computed* target — `net:[4026531840]`, the namespace identity test","iface":"procfs","mark":"","grammar":"flags","mode":["read-only"],"taught":"everything is a file","section":"General-purpose, used here to read kernel state","caps":[["A magic symlink's computed target",[["readlink /proc/self/ns/net","net:[4026531840] — the namespace identity test"],["readlink /proc/<pid>/fd/3","what fd 3 actually points at: a file, a socket, a pipe"],["readlink -f <path>","resolve every level"]]]],"course":[{"cmd":"readlink <name>","why":"print the path stored inside a symlink. On a magic `/proc` symlink that string is **computed on read**, not stored — which is what makes `/proc/self` work","act":"Act I — One machine talking to itself","lesson":"Lesson 6 — Everything is a file"}]},{"id":"stat","label":"`stat`","names":["stat"],"expand":"—","one":"Proves a `/proc` file reports `Size: 0` and still has content — the contradiction that makes \"everything is a file\" mean something","iface":"procfs","mark":"","grammar":"flags","mode":["read-only"],"taught":"everything is a file","section":"General-purpose, used here to read kernel state","caps":[["Proves a /proc file is not a file",[["stat /proc/net/tcp","Size: 0, and yet it has content — the contradiction that gives \"everything is a file\" meaning"],["stat -c '%s %F' /proc/self/status","size and type in one line"]]]],"course":[{"cmd":"stat /proc/net/dev","why":"print a file's metadata. procfs files report `Size: 0` and yet `cat` prints content: the contradiction the lesson is built on","act":"Act I — One machine talking to itself","lesson":"Lesson 6 — Everything is a file"}]},{"id":"sysctl","label":"`sysctl`","names":["sysctl"],"expand":"system control","one":"Every kernel tunable by name, and `-a` makes it searchable","iface":"procfs","mark":"","grammar":"flags","mode":["mutate"],"taught":"conntrack","section":"Reading the kernel's network state","caps":[["Every kernel tunable by name",[["sysctl -a | grep <pattern>","search — the discovery mode"],["sysctl net.ipv4.ip_forward","read one"],["sysctl -w net.ipv4.ip_forward=1","write it, until reboot"],["sysctl net.netfilter.nf_conntrack_max","the ceiling that turns into mysterious drops"],["cat /proc/sys/net/ipv4/ip_forward","the same value; sysctl keys ARE /proc/sys paths, dots for slashes"]]]],"course":[{"cmd":"sysctl net.netfilter.nf_conntrack_max","why":"the table ceiling. Compare against `-C`: as they converge, new connections fail intermittently under load — a failure that looks exactly like a flaky network","act":"Act III — The internet","lesson":"Lesson 2b — conntrack"}]},{"id":"ulimit","label":"`ulimit` / `prlimit`","names":["ulimit","prlimit"],"expand":"user limit / process limit","one":"The descriptor ceiling that quietly breaks busy servers — `prlimit` reads it on an *already-running* process","iface":"procfs","mark":"","grammar":"shell builtin / flags","mode":["mutate"],"taught":"minihttp","section":"Sockets and syscalls","caps":[["The descriptor ceiling that quietly breaks servers",[["ulimit -n","the soft limit for this shell"],["ulimit -Hn","the hard limit — the ceiling you cannot raise yourself"],["prlimit --pid <pid>","every limit on an ALREADY-RUNNING process"],["prlimit --pid <pid> --nofile=8192:8192","raise it without a restart"]]]],"course":[{"cmd":"ulimit -n","why":"`ulimit` (*user limit*); `-n` = max open file descriptors, soft limit. opt: `-Hn` for the hard limit","act":"Act I — One machine talking to itself","lesson":"Lesson 3 — Building minihttp, the listening server"}]},{"id":"curl","label":"`curl`","names":["curl"],"expand":"\"a play on *Client for URLs*\"","one":"Every byte of an HTTP(S) exchange with `-v`, plus timing breakdowns and protocol selection (`--http3`)","iface":"socket","mark":"","grammar":"flags","mode":["read-only"],"taught":"HTTP","section":"Sockets and syscalls","caps":[["Every byte of an HTTP exchange",[["curl -v https://example.com","request and response headers, plus the TLS handshake summary"],["curl -sS -o /dev/null -w '%{http_code} %{time_total}\\n' <url>","just the outcome and the timing"],["curl -o /dev/null -s -w '%{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer}\\n' <url>","where the time actually goes"],["curl --resolve example.com:443:10.0.0.1 https://example.com","override DNS without touching /etc/hosts"],["curl --http3 <url>","pin the protocol version; also --http2, --http1.1"],["curl -k <url>","skip certificate verification — and know that you did"],["curl --unix-socket /var/run/docker.sock http://localhost/version","HTTP over a Unix socket"]]]],"course":[{"cmd":"curl -s localhost:8080","why":"`curl` = HTTP client; `-s` = silent (no progress meter); `localhost:8080` = host:port","act":"Act I — One machine talking to itself","lesson":"Lesson 3 — Building minihttp, the listening server"},{"cmd":"curl -s -o /dev/null -w '%{http_code}\\n' 127.0.0.1:8080","why":"`-o /dev/null` = discard the body; `-w` = write out a chosen variable — `%{http_code}` is the status. The way to test reachability without reading a page","act":"Act I — One machine talking to itself","lesson":"Lesson 5 — Ports and /proc/net/tcp"},{"cmd":"curl --max-time 2 http://172.17.0.3:8081","why":"`--max-time 2` = give up after 2s, so a bound-to-loopback service fails fast instead of hanging","act":"Act I — One machine talking to itself","lesson":"Lesson 5 — Ports and /proc/net/tcp"},{"cmd":"curl -s google.com > /dev/null","why":"make and immediately finish one connection, so there is something in TIME_WAIT to look at","act":"Act III — The internet","lesson":"Lesson 2 — TCP states"},{"cmd":"curl -v http://httpbin.org/get 2>&1","why":"`-v` prints the request and response headers — `>` lines are sent, `<` received. `2>&1` merges stderr, where `-v` writes, so it can be piped","act":"Act III — The internet","lesson":"Lesson 4 — HTTP"},{"cmd":"curl -w \"dns: %{time_namelookup}s\\ntcp: %{time_connect}s\\ntls: %{time_appconnect}s\\ntotal: %{time_total}s\\n\" -o /dev/null -s <url>","why":"`-w` = write-out template with `%{variable}` fields. The cumulative timings that separate \"slow DNS\" from \"slow TLS\" from \"slow server\" in one command","act":"Act III — The internet","lesson":"Lesson 4 — HTTP"}]},{"id":"dig","label":"`dig`","names":["dig"],"expand":"\"domain information groper\" *(folklore — BIND's docs do not expand it)*","one":"The full DNS response — flags, authority and additional sections, TTLs. Talks to the resolver directly, **skipping NSS**","iface":"socket","mark":"","grammar":"`@server name type` + `+opts`","mode":["read-only"],"taught":"DNS","section":"Name resolution","caps":[["The full DNS answer",[["dig example.com","answer, authority and additional sections, with TTLs"],["dig +short example.com","just the data, for scripts"],["dig @1.1.1.1 example.com","ask a specific server, bypassing resolv.conf"],["dig +trace example.com","walk the delegation from the root — where a broken zone shows itself"],["dig -x 10.0.0.1","reverse lookup"],["dig SRV _https._tcp.example.com","any record type; SRV is how Kubernetes publishes ports"],["dig +tcp +dnssec example.com","force TCP; request DNSSEC records"]]]],"course":[{"cmd":"dig +trace google.com","why":"`+trace` walks the delegation from the root down, one query per level. Note the syntax: `+option`, not `-flag` — `dig` is not a getopt tool","act":"Act II — Two machines on one wire","lesson":"Lesson 4 — DNS"}]},{"id":"drill","label":"`drill`","names":["drill"],"expand":"—","one":"The same, DNSSEC-aware, and it ships in `netshoot` where `dig` sometimes doesn't","iface":"socket","mark":"","grammar":"flags","mode":["read-only"],"taught":"Act IV in the wild","section":"Name resolution","caps":[["DNSSEC-aware, and present in netshoot",[["drill example.com","a normal query"],["drill -S example.com","chase and verify the DNSSEC chain"],["drill @1.1.1.1 example.com A","a specific server and type"]]]],"course":[]},{"id":"getent hosts","label":"`getent hosts`","names":["getent hosts"],"expand":"get entries","one":"**What the application will actually get** — it resolves the way an application does, through glibc's Name Service Switch (`/etc/nsswitch.conf`, then `/etc/hosts`, then DNS), rather than talking to a nameserver directly. The tool that resolves \"`dig` works but the app can't\"","iface":"socket","mark":"¶","grammar":"`getent <db> <key>`","mode":["read-only"],"taught":"Act II diagnose","section":"Name resolution","caps":[["What the application will actually get",[["getent hosts example.com","resolves the way glibc does: nsswitch.conf, then /etc/hosts, then DNS"],["getent hosts localhost","answered from /etc/hosts with no socket opened at all"],["getent ahostsv4 example.com","IPv4 only, via the same NSS path"]]]],"course":[]},{"id":"host","label":"`host`","names":["host"],"expand":"—","one":"A one-line answer, which is what you want inside a loop","iface":"socket","mark":"","grammar":"flags","mode":["read-only"],"taught":null,"section":"Name resolution","caps":[["One line, which is what a loop wants",[["host example.com","the short answer"],["host -t MX example.com","one record type"],["host 10.0.0.1","reverse"]]]],"course":[]},{"id":"iperf3","label":"`iperf3`","names":["iperf3"],"expand":"internet performance","one":"Achievable throughput between two points, which no passive tool can tell you","iface":"socket","mark":"","grammar":"flags","mode":["read-only"],"taught":null,"section":"Sockets and syscalls","caps":[["Achievable throughput, which no passive tool can tell you",[["iperf3 -s","run the server side"],["iperf3 -c <host>","ten seconds of TCP, one stream"],["iperf3 -c <host> -P 8","eight parallel streams — often the only way to fill a fast link"],["iperf3 -c <host> -u -b 100M","UDP at a fixed rate, which is how you measure loss"],["iperf3 -c <host> -R","reverse direction"]]]],"course":[]},{"id":"nc","label":"`nc`","names":["nc"],"expand":"netcat","one":"A raw TCP/UDP endpoint you drive by hand — the smallest possible client or server","iface":"socket","mark":"","grammar":"flags","mode":["read-only"],"taught":"the TCP handshake","section":"Sockets and syscalls","caps":[["The smallest possible client or server",[["nc -l -p 9000","listen on a port and print what arrives"],["nc 10.0.0.1 9000","connect and type at it"],["nc -z -v -w 2 <host> 443","just test the port, with a timeout — the reachability one-liner"],["nc -u <host> 53","UDP"],["nc -l -p 9000 > out.bin","receive a file; the sender redirects in"]]]],"course":[{"cmd":"nc 127.0.0.1 8080","why":"`nc` (*netcat*) opens a raw TCP connection and, with nothing typed, just holds it open — so it shows as `ESTAB`. Run with `&` to keep your shell","act":"Act I — One machine talking to itself","lesson":"Lesson 5b — TCP states and the SYN scan"},{"cmd":"nc -u -l 9999","why":"`-u` = UDP; `-l` = listen. There is no handshake, so this \"connection\" is a fiction","act":"Act II — Two machines on one wire","lesson":"Lesson 3 — ICMP, UDP, and TTL"},{"cmd":"nc -l 8080","why":"listen. opt: `nc -l -k 8080` to keep listening after the first client disconnects","act":"Act III — The internet","lesson":"Lesson 1 — The three-way handshake"},{"cmd":"nc 127.0.0.1 8080","why":"connect. Between these two commands, the whole handshake happens","act":"Act III — The internet","lesson":"Lesson 1 — The three-way handshake"}]},{"id":"nslookup","label":"`nslookup`","names":["nslookup"],"expand":"name server lookup","one":"Nothing the others don't, but it is the one present on hosts with nothing else installed","iface":"socket","mark":"","grammar":"interactive","mode":["read-only"],"taught":"policy shapes","section":"Name resolution","caps":[["The one present when nothing else is",[["nslookup example.com","a query"],["nslookup example.com 10.96.0.10","against a specific server — the CoreDNS check inside a Pod"]]]],"course":[]},{"id":"openssl","label":"`openssl`","names":["openssl"],"expand":"—","one":"Every cryptographic primitive as a separate command (`dgst`, `enc`, `genpkey`, `x509`, `verify`) **and** `s_client`, which opens a TLS connection by hand so you read the handshake instead of trusting it. The only tool here that shows you a certificate chain as the peer actually presented it","iface":"socket","mark":"⁂","grammar":"verb-obj","mode":["mutate"],"taught":"TLS opened","section":"Sockets and syscalls","caps":[["Inspect a live TLS connection",[["openssl s_client -connect example.com:443","the handshake and the chain as the peer presented it"],["openssl s_client -connect example.com:443 -servername example.com","with SNI — without it you get the default vhost"],["openssl s_client -connect <h>:443 -showcerts","every certificate in the chain, PEM encoded"],["openssl s_client -connect <h>:443 -tls1_2","pin a version to test what is still accepted"]]],["Read a certificate",[["openssl x509 -in cert.pem -noout -text","everything: subject, SAN, validity, extensions"],["openssl x509 -in cert.pem -noout -dates -subject -ext subjectAltName","just the fields you asked for"],["openssl verify -CAfile ca.pem cert.pem","does this chain actually validate"]]],["Primitives, one command each",[["openssl dgst -sha256 <file>","a hash"],["openssl dgst -sha256 -hmac <key> <file>","a keyed hash — authentication, not just integrity"],["openssl genpkey -algorithm ed25519 -out key.pem","a private key"],["openssl rand -hex 16","cryptographically random bytes"]]]],"course":[{"cmd":"openssl s_client -connect example.com:443 -servername example.com","why":"`s_client` = a TLS client you drive by hand; `-connect host:port`; `-servername` sets SNI, without which a shared-IP server can't know which certificate to send","act":"Act III — The internet","lesson":"Lesson 5 — TLS"}]},{"id":"ping","label":"`ping`","names":["ping"],"expand":"named after sonar; \"Packet InterNet Groper\" is *(folklore)*","one":"Whether ICMP echo returns, and the RTT distribution","iface":"socket","mark":"§","grammar":"flags","mode":["read-only"],"taught":"loopback","section":"Reachability and paths","caps":[["Is it reachable, and how variable is the path",[["ping -c 4 <host>","four probes and an RTT summary"],["ping -i 0.2 -c 100 <host>","faster interval, enough samples to see jitter"],["ping -M do -s 1472 <host>","don't fragment at exactly 1500 bytes total — the MTU probe"],["ping -I <dev> <host>","force the source interface"]]]],"course":[{"cmd":"ping -c 4 127.0.0.1","why":"`-c 4` = stop after 4 packets; trailing = target. opt: `-i 0.2` for a shorter interval","act":"Act I — One machine talking to itself","lesson":"Lesson 4 — The loopback interface"},{"cmd":"ping -c 4 172.17.0.3","why":"the container's own external address — same kernel, so it still never touches a wire","act":"Act I — One machine talking to itself","lesson":"Lesson 4 — The loopback interface"},{"cmd":"ping -c 2 <unused address in your subnet>","why":"forces an ARP request for an address nobody owns, so you can watch the request go out and nothing come back","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"},{"cmd":"ping -c1 -M do -s 1472 <gateway>","why":"`-M do` = set **Don't Fragment**; `-s 1472` = payload bytes. 1472 + 8 (ICMP) + 20 (IP) = exactly 1500, so it fits. Use your gateway, not `8.8.8.8` — external ICMP is often dropped entirely","act":"Act II — Two machines on one wire","lesson":"Lesson 3b — MTU and fragmentation"},{"cmd":"ping -c1 -M do -s 1473 <gateway>","why":"one byte over, and DF forbids splitting it, so it fails with **`ping: sendmsg: Message too large`**. Note *where* that came from: it is a local `EMSGSIZE` from your own stack, not an ICMP \"fragmentation needed\" from a router — a distinction the path-MTU-discovery story depends on. This pair is how you *measure* a path's MTU rather than guess it","act":"Act II — Two machines on one wire","lesson":"Lesson 3b — MTU and fragmentation"}]},{"id":"socat","label":"`socat`","names":["socat"],"expand":"SOcket CAT","one":"`nc` with every socket type on both sides: TLS, Unix sockets, PTYs, and bidirectional relays between any two","iface":"socket","mark":"","grammar":"`addr1 addr2`","mode":["read-only"],"taught":null,"section":"Sockets and syscalls","caps":[["nc, but every socket type on both sides",[["socat TCP-LISTEN:9000,fork,reuseaddr STDOUT","a listener that handles more than one connection"],["socat TCP-LISTEN:8080,fork TCP:10.0.0.1:80","a TCP relay — a port forward in one line"],["socat UNIX-CONNECT:/var/run/docker.sock STDIO","speak to a Unix socket by hand"],["socat OPENSSL:example.com:443,verify=1 STDIO","a TLS client"],["socat TCP-LISTEN:9000 EXEC:/bin/sh","the pattern that explains why exposing socat is dangerous"]]]],"course":[]},{"id":"ssh","label":"`ssh`","names":["ssh"],"expand":"secure shell","one":"Port forwarding and proxying that no other tool here provides: a local, reverse or SOCKS tunnel through a host you can already log into. Not taught by this course — Toolbelt.md assumes you have it.","iface":"socket","mark":"","grammar":"flags","mode":["mutate"],"taught":null,"section":"Not in the course","course":[],"caps":[["Tunnels — the networking half of ssh",[["ssh -L 8080:10.0.0.1:80 <bastion>","local forward: your port 8080 becomes their 10.0.0.1:80"],["ssh -R 9000:localhost:3000 <host>","reverse forward: expose YOUR service on the remote side"],["ssh -D 1080 <bastion>","a SOCKS proxy — route a browser through the far side"],["ssh -J <bastion> <target>","ProxyJump: the bastion pattern, without agent forwarding"],["ssh -N -f -L 8080:10.0.0.1:80 <host>","no shell, background — the form a tunnel actually takes"],["ssh -vvv <host>","the handshake and every auth method tried, in order"]]]]},{"id":"arping","label":"`arping`","names":["arping"],"expand":"ARP ping","one":"Reachability at **layer 2**, bypassing IP entirely — proves the wire works when routing does not","iface":"packet","mark":"","grammar":"flags","mode":["read-only"],"taught":"ethernet and ARP","section":"Reachability and paths","caps":[["Reachability below IP",[["arping -I <dev> -c 3 <ip>","proves wire and neighbour work when routing does not"],["arping -D -I <dev> <ip>","duplicate address detection — is someone else already using it"]]]],"course":[{"cmd":"arping -c 1 <ip>","why":"ARP-level reachability: **layer 2 only, no IP involved**. Proves the wire when routing is broken","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"}]},{"id":"mtr","label":"`mtr`","names":["mtr"],"expand":"\"Matt's traceroute\" *(after Matt Kimball — widely reported, not in the project's docs)*","one":"Continuous per-hop loss and latency, which is how you tell \"one bad hop\" from \"the whole path is bad\"","iface":"packet","mark":"","grammar":"flags","mode":["live"],"taught":null,"section":"Reachability and paths","caps":[["Loss per hop, continuously",[["mtr -n <host>","the interactive view: one line per hop, loss and latency updating"],["mtr -n -r -c 100 <host>","a report of 100 cycles, for pasting into a ticket"],["mtr -n -T -P 443 <host>","TCP mode"]]]],"course":[]},{"id":"nmap","label":"`nmap`","names":["nmap"],"expand":"network mapper","one":"What a *scanner* sees, including the half-open SYN scan that never completes a handshake so your application never logs it","iface":"packet","mark":"‡","grammar":"flags","mode":["read-only"],"taught":"TCP states and the SYN scan","section":"Capture and packet-level inspection","caps":[["What a scanner sees",[["nmap -sT -p- <host>","full TCP connect scan — your application logs every one"],["nmap -sS -p 1-1000 <host>","half-open SYN scan: never completes the handshake, so nothing logs it"],["nmap -sU -p 53,123 <host>","UDP, which is slow and inference-based"],["nmap -sV <host>","service and version detection from banners"],["nmap -Pn -n <host>","skip host discovery and DNS — the flags that matter inside a cluster"]]]],"course":[{"cmd":"nmap -sS -p 8080 127.0.0.1","why":"`nmap` (*network mapper*); `-sS` = SYN (\"stealth\") scan — send SYN, read the reply, send RST instead of ACK. Stops at `SYN_RECV`, so `accept()` never fires and the application never sees it. `-p` = ports. Needs root","act":"Act I — One machine talking to itself","lesson":"Lesson 5b — TCP states and the SYN scan"},{"cmd":"nmap -sT -p 8080 127.0.0.1","why":"`-sT` = connect scan — completes the handshake, so the app *does* see it. opt: `-p 1-1024` a range, `-Pn` skip the host-up probe","act":"Act I — One machine talking to itself","lesson":"Lesson 5b — TCP states and the SYN scan"},{"cmd":"nmap --script broadcast-dhcp-discover -e eth0","why":"`--script` runs an NSE script; this one broadcasts a DHCP DISCOVER; `-e eth0` = out which interface. Shows the offer without accepting it","act":"Act II — Two machines on one wire","lesson":"Lesson 3c — DHCP"}]},{"id":"scapy","label":"`scapy`","names":["scapy"],"expand":"—","one":"Packets you *construct*: become the protocol instead of watching it. The active counterpart to `tcpdump`","iface":"packet","mark":"","grammar":"Python library","mode":["mutate","live"],"taught":"ethernet and ARP","section":"Capture and packet-level inspection","caps":[["Construct packets instead of watching them",[["sr1(IP(dst='10.0.0.1')/ICMP())","send one, get one reply"],["Ether()/ARP(op=2, psrc='10.0.0.1', hwsrc='de:ad:be:ef:00:01')","a forged ARP reply — how you demonstrate spoofing"],["sniff(iface='eth0', count=10)","capture, as a Python list of objects"],["IP(dst='10.0.0.1', flags='DF')/TCP()/('x'*2000)","oversized with DF set — reproduce a black-hole MTU"]]]],"course":[{"cmd":"scapy","why":"starts the interactive packet-crafting shell","act":"Act II — Two machines on one wire","lesson":"Lesson 1 — The wire and the two names"}]},{"id":"tcpdump","label":"`tcpdump`","names":["tcpdump"],"expand":"TCP dump","one":"Bytes actually on the wire, with a compositional filter language and `-w` to a `.pcap` you can open elsewhere","iface":"packet","mark":"","grammar":"flags + *libpcap filter*","mode":["live"],"taught":"ICMP and UDP","section":"Capture and packet-level inspection","caps":[["Capture",[["tcpdump -i <dev> -nn","no name or port resolution — always start here"],["tcpdump -i any -nn","every interface at once"],["tcpdump -i <dev> -w cap.pcap","to a file you can open in Wireshark"],["tcpdump -r cap.pcap -nn","read it back"],["tcpdump -i <dev> -c 100 -s 0","stop after 100 packets; full payload"]]],["The filter language — compositional, not grep",[["tcpdump -nn 'tcp port 443'","host, net, port, and the protocol keywords"],["tcpdump -nn 'host 10.0.0.1 and not port 22'","and / or / not"],["tcpdump -nn 'tcp[tcpflags] & tcp-syn != 0'","byte-level: SYNs only"],["tcpdump -nn 'icmp[icmptype] == icmp-unreach'","the fragmentation-needed message MTU bugs hide in"]]],["Read the packet",[["tcpdump -nn -v","TTL, id and flags"],["tcpdump -nn -X","hex and ASCII payload"],["tcpdump -nn -e","Ethernet headers, so you see MACs and VLAN tags"]]]],"course":[{"cmd":"tcpdump -nn -i any icmp","why":"`-nn` = resolve neither hostnames nor **port names** (single `-n` is hosts only); `-i any` = every interface; `icmp` = the filter expression. opt: `-c 5` stop after 5, `-w f.pcap` write a capture file","act":"Act II — Two machines on one wire","lesson":"Lesson 3 — ICMP, UDP, and TTL"},{"cmd":"tcpdump -nn -i eth0 udp port 9999","why":"`udp port 9999` composes protocol + type + value from libpcap's filter grammar","act":"Act II — Two machines on one wire","lesson":"Lesson 3 — ICMP, UDP, and TTL"},{"cmd":"tcpdump -i eth0 -n -v port 67 or port 68","why":"`or` composes two filter primitives; 67 is the server, 68 the client; `-v` prints the option fields, which is where the interesting content is","act":"Act II — Two machines on one wire","lesson":"Lesson 3c — DHCP"},{"cmd":"tcpdump -i any -nn tcp port 8080","why":"capture both directions of one port. You will see exactly three packets before any data: `[S]`, `[S.]`, `[.]`","act":"Act III — The internet","lesson":"Lesson 1 — The three-way handshake"},{"cmd":"tcpdump -ni vu2 -c 4 udp port 4789","why":"the **outer** packets. Your ICMP is now cargo inside UDP — the encapsulation, visible","act":"Act IV — One machine pretends to be many","lesson":"Lesson 4 — Overlay and VXLAN"}]},{"id":"traceroute","label":"`traceroute`","names":["traceroute"],"expand":"—","one":"The hop list, by walking TTL upward","iface":"packet","mark":"","grammar":"flags","mode":["read-only"],"taught":"ICMP and UDP","section":"Reachability and paths","caps":[["The hop list",[["traceroute -n <host>","numeric, so a slow reverse lookup cannot stall it"],["traceroute -I <host>","ICMP probes instead of the UDP default"],["traceroute -T -p 443 <host>","TCP to a real port — gets through filters that drop UDP"]]]],"course":[{"cmd":"traceroute 8.8.8.8","why":"sends packets with rising TTL; each hop that discards one replies with ICMP \"time exceeded\", revealing itself. opt: `-n` skip reverse DNS, which makes it much faster","act":"Act II — Two machines on one wire","lesson":"Lesson 3 — ICMP, UDP, and TTL"}]},{"id":"tshark","label":"`tshark`","names":["tshark"],"expand":"terminal shark","one":"The same capture *dissected* — Wireshark's protocol decoders, so you read fields instead of hex","iface":"packet","mark":"","grammar":"flags + *filter*","mode":["live"],"taught":"Act II in the wild","section":"Capture and packet-level inspection","caps":[["The same capture, dissected",[["tshark -i <dev> -n","live, with Wireshark's protocol decoders"],["tshark -r cap.pcap -Y 'http.request'","-Y is a display filter — fields, not bytes"],["tshark -r cap.pcap -T fields -e ip.src -e tcp.dstport","extract named fields as columns"],["tshark -r cap.pcap -z conv,tcp","conversation statistics"]]]],"course":[]},{"id":"bpftool","label":"`bpftool`","names":["bpftool"],"expand":"\"BPF tool\" *(folklore — undocumented)*","one":"What eBPF programs and maps are loaded and where they are attached. `bpftool net show` covers xdp/tc/tcx per device; **`bpftool cgroup tree` covers the cgroup hooks, which is where Cilium's socket-level load balancing actually lives.** The inventory command for an eBPF datapath, with no substitute","iface":"probe","mark":"","grammar":"obj-verb","mode":["mutate","live"],"taught":null,"section":"Reading the kernel's network state","caps":[["The inventory command for an eBPF datapath",[["bpftool prog show","every loaded program, its type and where it came from"],["bpftool net show","xdp, tc and tcx attachments per device"],["bpftool cgroup tree","the cgroup hooks — where Cilium's socket load balancing lives"],["bpftool map show","every map"],["bpftool map dump id <n>","its contents — the actual service table"]]]],"course":[]},{"id":"bpftrace","label":"`bpftrace`","names":["bpftrace"],"expand":"BPF trace","one":"Kernel and userspace probes at near-zero overhead, on a live production box, without stopping anything. `strace`'s successor","iface":"probe","mark":"","grammar":"its own language","mode":["live"],"taught":null,"section":"Sockets and syscalls","caps":[["Probes on a live box, at near-zero cost",[["bpftrace -l 'tracepoint:*'","list every available probe"],["bpftrace -e 'tracepoint:syscalls:sys_enter_connect { printf(\"%s\\n\", comm); }'","who is calling connect"],["bpftrace -e 'kprobe:tcp_retransmit_skb { @[comm] = count(); }'","count retransmits by process"],["bpftrace -e 'kretprobe:inet_csk_accept { @ = hist(retval); }'","a histogram, aggregated in-kernel"]]]],"course":[]},{"id":"falco","label":"`falco`","names":["falco"],"expand":"—","one":"Syscall-level events *as they happen* — the runtime half that no scanner can give you","iface":"probe","mark":"","grammar":"rules + flags","mode":["live"],"taught":"seeing it happen","section":"Supply chain and runtime security","caps":[["Syscall-level events as they happen",[["falco -r /etc/falco/falco_rules.yaml","run with a ruleset"],["falco -L","list loaded rules"],["falco --list=syscall","which events can be matched at all"]]]],"course":[]},{"id":"ltrace","label":"`ltrace`","names":["ltrace"],"expand":"library call trace","one":"The same, one layer up: libc calls rather than syscalls","iface":"probe","mark":"","grammar":"flags","mode":["live"],"taught":"minihttp","section":"Sockets and syscalls","caps":[["One layer up from syscalls",[["ltrace <cmd>","libc calls, so you see getaddrinfo rather than the sockets under it"],["ltrace -e getaddrinfo <cmd>","filter to the call you care about"]]]],"course":[{"cmd":"ltrace <prog>","why":"like `strace` but for **library** calls (libc) rather than syscalls — one layer up","act":"Act I — One machine talking to itself","lesson":"Lesson 3 — Building minihttp, the listening server"}]},{"id":"pwru","label":"`pwru`","names":["pwru"],"expand":"\"packet, where are you?\"","one":"Which **kernel function** your packet passed through, and which one dropped it — kprobes on every `skb`-taking function. Structurally impossible with `tcpdump`, and the tool Cilium support asks you to run","iface":"probe","mark":"","grammar":"flags + *filter*","mode":["live"],"taught":null,"section":"Capture and packet-level inspection","caps":[["Which kernel function dropped your packet",[["pwru --filter-dst-ip 10.0.0.1","trace one destination through every skb-taking function"],["pwru 'tcp port 443'","a pcap-style filter, compiled to eBPF"],["pwru --output-tuple --all-kmods","print the tuple at each hop, across modules"]]]],"course":[]},{"id":"retis","label":"`retis`","names":["retis"],"expand":"—","one":"libpcap filters compiled to eBPF and inlined at *arbitrary probe points*, correlating kernel packet-buffer (`skb`) drops, netfilter verdicts and conntrack against one packet","iface":"probe","mark":"","grammar":"verb-obj","mode":["live"],"taught":null,"section":"Capture and packet-level inspection","caps":[["Correlate drops, verdicts and conntrack for one packet",[["retis collect -c skb-drop","why packets are dropped, with the kernel's own reason code"],["retis collect -f 'tcp port 80' -c skb,nft,ct","one filter, probes across netfilter and conntrack"],["retis sort","reassemble collected events into per-packet timelines"]]]],"course":[]},{"id":"strace","label":"`strace`","names":["strace"],"expand":"system call trace","one":"The exact syscalls a process makes, with arguments and return values — and it stops the world to do it","iface":"probe","mark":"","grammar":"`-e trace=…`","mode":["live"],"taught":"minihttp","section":"Sockets and syscalls","caps":[["Exactly which syscalls a process makes",[["strace -e trace=network <cmd>","only the socket calls — how you see which kernel API a tool speaks"],["strace -f -p <pid>","attach to a running process and follow its children"],["strace -e trace=openat -f <cmd>","which files it looks for, in order — how you debug config lookup"],["strace -c <cmd>","a summary count per syscall, instead of the firehose"],["strace -T -tt <cmd>","timestamps and per-call duration — where the wait actually is"]]]],"course":[{"cmd":"strace -e tra
